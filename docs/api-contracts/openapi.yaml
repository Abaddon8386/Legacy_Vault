      required: [id, beneficiaryId, documentType, result, verifiedBy, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        documentType: { type: string, enum: [CCCD, PASSPORT] }
        issuingAuthority: { type: string, nullable: true }
        documentSuffix: { type: string, nullable: true }
        result: { type: string, enum: [MATCH, NOT_MATCH] }
        verifiedBy:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid, description: Public ID của tài khoản Staff đã kiểm tra }
            fullName: { type: string, description: Tên hiện tại của Staff để hiển thị }
        verifiedAt: { type: string, format: date-time }
    CounterIdentityAttestationRequest:
      type: object
      required: [evidenceReference]
      properties:
        evidenceReference: { type: string, minLength: 1, maxLength: 200, description: Reference to the off-system counter evidence; do not include document numbers or document contents }
        confirmedEmail: { type: string, format: email, maxLength: 254, nullable: true, description: Optional address directly confirmed by Staff with the Beneficiary at the counter; not a client claim of email ownership and not returned in the response }
    CounterIdentityAttestation:
      type: object
      required: [attestationId, caseId, beneficiaryId, recordedBy, recordedAt]
      properties:
        attestationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        recordedBy: { type: string, format: uuid, description: Authenticated Staff public ID }
        recordedAt: { type: string, format: date-time, description: Server-generated UTC timestamp }
    BeneficiaryResponse:
      type: object
      required: [id, vaultId, fullName, hasAccount, hasIdentityNumber, status]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        fullName: { type: string }
        relationship: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        hasIdentityNumber: { type: boolean }
        hasAccount: { type: boolean, description: True when this Beneficiary is linked to a real User account through the counter workflow or invitation service }
        status: { type: string, enum: [DESIGNATED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BeneficiaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/BeneficiaryResponse' }
    ConfigurationCheck:
      type: object
      required: [vaultId, ready, beneficiaryCount, issues]
      properties:
        vaultId: { type: string, format: uuid }
        ready: { type: boolean }
        beneficiaryCount: { type: integer, minimum: 0 }
        issues:
          type: array
          items:
            type: object
            required: [code, messageKey, message]
            properties:
              code: { type: string, example: BENEFICIARY_REQUIRED }
              messageKey: { type: string }
              message: { type: string }

    ConfigureDmsRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [checkIntervalDays]
        - required: [checkIntervalMinutes]
      properties:
        checkIntervalDays:
          type: integer
          minimum: 1
          maximum: 180
          description: Legacy whole days; mutually exclusive with checkIntervalMinutes
        checkIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 259200
          description: Whole minutes, supported in production; exactly one duration field
    DmsResponse:
      type: object
      required: [ownerId, status, checkIntervalDays, checkIntervalMinutes, gracePeriodDays, nextCheckAt]
      properties:
        ownerId: { type: string, format: uuid, description: 'public_id của tài khoản Owner; DMS thuộc Owner, mỗi Owner một DMS' }
        status: { type: string, enum: [MONITORING, TRIGGERED, GRACE_PERIOD_EXCEEDED] }
        checkIntervalDays: { type: integer, nullable: true, description: Exact whole days or null for a non-whole-day duration; never rounded }
        checkIntervalMinutes: { type: integer, minimum: 1, description: Authoritative duration; legacy rows may exceed the new configuration maximum }
        gracePeriodDays: { type: integer, description: 'Chỉ đọc; server cấu hình qua DMS_GRACE_PERIOD_DAYS, mặc định 1 (A5)' }
        lastCheckInAt: { type: string, format: date-time, nullable: true }
        nextCheckAt: { type: string, format: date-time }
        triggeredAt: { type: string, format: date-time, nullable: true }
        graceDeadline: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    AdminOverview:
      type: object
      required: [totalAccounts, activeVaults, processingCases, roleAssignments, startedAt, completedAt, consistency]
      properties:
        totalAccounts: { type: integer, format: int64, minimum: 0 }
        activeVaults: { type: integer, format: int64, minimum: 0 }
        processingCases: { type: integer, format: int64, minimum: 0 }
        roleAssignments:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        consistency: { type: string, enum: [READ_COMMITTED_COLLECTION_WINDOW] }

    SubscriptionUpgradeRequest:
      type: object
      required: [planCode, catalogVersion]
      properties:
        planCode: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        catalogVersion: { type: integer, minimum: 1, example: 2 }
    SubscriptionUpgradeResponse:
      type: object
      required: [subscription, priceDifferenceVnd, changed]
      properties:
        subscription: { $ref: '#/components/schemas/CurrentSubscription' }
        priceDifferenceVnd: { type: integer, format: int64, minimum: 0 }
        changed: { type: boolean }
    SubscriptionLimits:
      type: object
      required: [assetCount, storageBytes, fileBytes]
      properties:
        assetCount: { type: integer, format: int64, minimum: 1 }
        storageBytes: { type: integer, format: int64, minimum: 1, description: Byte nội dung theo đơn vị nhị phân }
        fileBytes: { type: integer, format: int64, minimum: 1 }
    SubscriptionPlan:
      type: object
      required: [code, version, priceVnd, billingModel, limits]
      properties:
        code: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        version: { type: integer, minimum: 1 }
        priceVnd: { type: integer, format: int64, minimum: 0, description: One-time purchase price in VND }
        billingModel: { type: string, enum: [LIFETIME] }
        limits: { $ref: '#/components/schemas/SubscriptionLimits' }
    CurrentSubscription:
      type: object
      required: [effectivePlan, effectiveUntil, usage, overQuota, vaultCreated, evaluatedAt]
      properties:
        effectivePlan: { $ref: '#/components/schemas/SubscriptionPlan' }
        effectiveUntil: { type: string, format: date-time, nullable: true, description: Luôn null vì mọi gói đều trọn đời }
        usage:
          type: object
          required: [assetCount, storageBytes, willCount, assetOnlyCount]
          properties:
            assetCount: { type: integer, format: int64, minimum: 0, description: Số được tính vào giới hạn gói, bao gồm di chúc (PS-92, D-API-42) }
            storageBytes: { type: integer, format: int64, minimum: 0 }
            willCount: { type: integer, format: int64, minimum: 0, description: Số di chúc nằm trong assetCount }
            assetOnlyCount: { type: integer, format: int64, minimum: 0, description: assetCount trừ willCount; số tài sản Owner thấy trong danh sách }
        overQuota:
          type: object
          required: [assets, storage]
          properties:
            assets: { type: boolean }
            storage: { type: boolean }
        vaultCreated: { type: boolean }
        evaluatedAt: { type: string, format: date-time, description: ISO-8601 UTC }

    AdminAuditActor:
      type: object
      required: [kind, userId]
      properties:
        kind: { type: string, enum: [USER, SYSTEM, DELETED_USER, UNKNOWN] }
        userId: { type: string, format: uuid, nullable: true, description: Public user UUID; never a DB key }
    AdminAuditEvent:
      type: object
      required: [id, occurredAt, actor, action, entityType, vaultId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/AdminAuditActor' }
        action: { type: string, description: Known AuditAction or LEGACY_EVENT }
        entityType: { type: string, description: Allowlisted label or OTHER }
        vaultId: { type: string, format: uuid, nullable: true, description: Public vault UUID }
    AdminAuditPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AdminAuditDetail:
      type: object
      required: [event, traceId]
      properties:
        event: { $ref: '#/components/schemas/AdminAuditEvent' }
        traceId: { type: string, format: uuid, nullable: true }
