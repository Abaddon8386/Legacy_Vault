openapi: 3.0.3
info:
  title: LegacyVault API
  version: 0.1.0-draft
  description: |
    Contract Sprint 1 (PS-9 → PS-23). Quyết định đã chốt ngày 2026-10-11 (xem open-decisions.md), chờ FE/BE review.
    `x-status: designed` = đã chốt contract, chưa triển khai. `x-status: implemented` = đã có code Backend trong workspace.
    Mọi lỗi dùng cùng hình dạng `ApiError` (kể cả 401/403). FE phân loại lỗi bằng `code`, không bằng `message`.
    Ví dụ dùng dữ liệu giả; không chứa token hay mật khẩu thật.
servers:
  - url: http://localhost:8080
    description: Backend local
  - url: http://localhost:5173
    description: Qua Vite proxy (khuyến nghị khi dev)
tags:
  - name: System
  - name: Auth
  - name: Vaults
  - name: Assets
  - name: Wills
  - name: Trustees
  - name: Staff
  - name: Legal
  - name: Beneficiaries
  - name: DMS
  - name: Subscriptions

security:
  - bearerAuth: []

paths:
  /api/v1/subscription-plans:
    get:
      tags: [Subscriptions]
      summary: Catalog gói sử dụng (PS-77)
      description: Quyền ROLE_VAULT_OWNER. Gói trọn đời được chọn sau đăng ký; GET không thay đổi gói.
      x-status: implemented
      responses:
        '200':
          description: Ba gói theo giới hạn tài sản tăng dần. Byte nhị phân; giá VND một lần, trọn đời.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubscriptionPlan' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: Gói hiệu lực và usage của Owner hiện tại (PS-77)
      description: |
        Quyền ROLE_VAULT_OWNER; Owner lấy từ principal. Chưa có Vault vẫn 200 với usage 0.
        Owner mặc định BASIC; tự nâng gói trọn đời qua /subscriptions/me/upgrade, không hạ gói.
        Count gồm mọi Asset còn lưu kể cả DOCUMENT; byte gồm payload UTF-8 và mọi file version còn lưu.
        Evidence pháp lý có quota riêng cho ca (100 MiB, 50 phiên bản), không ghép vào usage Owner.
      x-status: implemented
      responses:
        '200':
          description: Snapshot gói/usage dưới cùng khóa Owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSubscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/subscriptions/me/upgrade:
    post:
      tags: [Subscriptions]
      summary: Owner chọn hoặc nâng gói trọn đời của chính mình (PS-77)
      description: |
        ROLE_VAULT_OWNER. Owner lấy từ principal; giá và hạn mức lấy từ catalog server.
        Hiệu lực ngay, không hạ gói, không hết hạn. Lặp lại gói hiện tại trả changed=false.
        priceDifferenceVnd là chênh lệch catalog; API không xử lý thanh toán hay chứng minh đã thu tiền.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpgradeRequest' }
      responses:
        '200':
          description: Gói đã được lưu cùng audit trong một transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionUpgradeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SUBSCRIPTION_CATALOG_STALE hoặc SUBSCRIPTION_DOWNGRADE_NOT_ALLOWED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/system/ping:
    get:
      tags: [System]
      summary: Smoke test ứng dụng (PS-74)
      x-status: implemented
      security: []
      responses:
        '200':
          description: Ứng dụng đang chạy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PingResponse' }
              example: { status: UP, service: legacyvault-backend, time: '2026-10-08T10:00:00Z' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/system/db-check:
    get:
      tags: [System]
      summary: Kiểm tra kết nối SQL Server bằng truy vấn chỉ đọc (chỉ profile dev)
      description: Profile khác `dev` -> 404. Chỉ trả UP/DOWN, không bao giờ trả lỗi SQL.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DbCheckResponse' }
              example: { database: UP }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (PS-9, ST-01)
      x-status: designed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { fullName: Nguyen Van A, email: user@example.com, password: ExamplePass123, phone: '0900000000' }
      responses:
        '201':
          description: Tạo thành công
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                timestamp: '2026-10-08T10:00:00Z'
                status: 409
                code: EMAIL_ALREADY_EXISTS
                messageKey: error.auth.emailExists
                message: Email này đã được đăng ký.
                path: /api/v1/auth/register
                traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
                errors: []

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, nhận JWT (PS-10, ST-01)
      x-status: designed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: user@example.com, password: ExamplePass123 }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                accessToken: <jwt>
                tokenType: Bearer
                expiresInSeconds: 3600
                user: { id: 3f2b8c1e-0a4d-4c8e-9b1a-6a1d2f3e4b5c, fullName: Nguyen Van A, email: user@example.com, roles: [VAULT_OWNER] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Thông tin người đăng nhập (đề xuất D-API-23)
      x-status: designed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/vaults:
    post:
      tags: [Vaults]
      summary: Tạo Vault (PS-12, ST-02)
      description: |
        Chủ sở hữu lấy từ Security Context. Mọi trường `ownerId`/`status` trong body bị bỏ qua.
        Mỗi Owner chỉ từng tạo thành công một Vault trong suốt vòng đời, bất kể trạng thái/gói.
        Request đồng thời được serialize; lần tạo thứ hai trả 409 VAULT_ALREADY_EXISTS.
      x-status: designed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVaultRequest' }
            example: { name: Kho di sản gia đình, description: Tài sản số của gia đình }
      responses:
        '201':
          description: Đã tạo (status ACTIVE)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Vaults]
      summary: Liệt kê Vault của tôi (đề xuất D-API-23)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/vaults/{vaultId}:
    get:
      tags: [Vaults]
      summary: Xem Vault (PS-14) — chỉ chủ sở hữu
      description: Không tồn tại hoặc của người khác -> 404 (D-API-07).
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/configuration-check:
    get:
      tags: [Beneficiaries]
      summary: Kiểm tra điều kiện cấu hình, cần ≥ 1 Beneficiary (PS-21, D-API-25)
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/VaultId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationCheck' }
              example:
                vaultId: 9c1f0b6e-5a3c-4a8e-8d2f-1b7c6e5d4a39
                ready: false
                beneficiaryCount: 0
                issues:
                  - { code: BENEFICIARY_REQUIRED, messageKey: config.beneficiaryRequired, message: Cần ít nhất một người thụ hưởng. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/assets:
    post:
      tags: [Assets]
      summary: Tạo Asset (PS-15, ST-02)
      description: |
        `payload` chỉ ghi, mã hóa phía server, không có trong response tạo Asset.
        Count mọi Asset còn lưu kể cả DOCUMENT; vượt quota trả 409 ASSET_QUOTA_EXCEEDED hoặc STORAGE_QUOTA_EXCEEDED (PS-77).
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
            example: { name: Mật khẩu email dự phòng, assetType: CREDENTIAL, description: Email phụ, payload: '<bí mật>' }
      responses:
        '201':
          description: Đã tạo
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Assets]
      summary: Liệt kê Asset của Vault (PS-15)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Chỉ metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/assets/{assetId}:
    get:
      tags: [Assets]
      summary: Xem Asset (PS-16)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: OK (không có payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      summary: Cập nhật một phần Asset (PS-16, D-API-24)
      description: |
        Chỉ `name`, `description`, `payload` được đổi; trường khác bị bỏ qua.
        Payload tính quota theo chênh lệch byte UTF-8; tăng vượt storage trả 409 STORAGE_QUOTA_EXCEEDED (PS-77).
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetRequest' }
            example: { description: Cập nhật ghi chú }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/vaults/{vaultId}/assets/{assetId}/reveal:
    post:
      tags: [Assets]
      summary: Xem nội dung bảo mật của Asset sau khi nhập lại mật khẩu (PS-16, D-API-32)
      description: |
        Owner nhập lại mật khẩu đăng nhập hiện tại. Chỉ khi Vault `ACTIVE`. Response không được cache.
        Sai mật khẩu 403 `REAUTH_FAILED` (không phải 401). Quá giới hạn thử 429 `TOO_MANY_ATTEMPTS`.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevealAssetRequest' }
      responses:
        '200':
          description: "OK (header Cache-Control: no-store)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetSecretResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/vaults/{vaultId}/wills:
    post:
      tags: [Wills]
      summary: Upload bản số hóa di chúc (PS-17, ST-03)
      description: |
        Trạng thái chỉ `UPLOADED`; không bao giờ `LEGAL_APPROVED`. SHA-256 chỉ phát hiện thay đổi,
        không chứng minh giá trị pháp lý. Loại file: PDF/JPEG/PNG, tối đa 10485760 byte.
        Một Will mới chiếm một Asset; mọi file version còn lưu đều tính storage (PS-77).
        Tăng vượt quota trả 409 ASSET_QUOTA_EXCEEDED hoặc STORAGE_QUOTA_EXCEEDED.
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Đã tải lên (version 1)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Wills]
      summary: Liệt kê hồ sơ di chúc số hóa (PS-17)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WillPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/wills/{willId}:
    get:
      tags: [Wills]
      summary: Xem metadata di chúc số hóa (không trả nội dung file)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/WillId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WillResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/wills/{willId}/versions:
    post:
      tags: [Wills]
      summary: Tải phiên bản mới, giữ phiên bản cũ (PS-18)
      description: Tính dung lượng mọi version còn lưu; thêm version không tăng count Asset. Vượt storage trả 409 STORAGE_QUOTA_EXCEEDED (PS-77).
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/WillId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Đã thêm phiên bản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WillResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    get:
      tags: [Wills]
      summary: Danh sách phiên bản kèm SHA-256 (PS-18)
      x-status: designed
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/WillId'
      responses:
        '200':
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WillVersion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/wills/{willId}/versions/{version}/download:
    post:
      tags: [Wills]
      summary: Mở/tải nội dung một phiên bản file di chúc sau khi nhập lại mật khẩu (PS-17/18, D-API-33)
      description: |
        Owner nhập lại mật khẩu đăng nhập hiện tại. Chỉ khi Vault `ACTIVE`. Response luôn là `attachment`, `nosniff`,
        `no-store`. BE so lại SHA-256 trước khi trả; lệch thì không trả file. Sai mật khẩu 403 `REAUTH_FAILED`.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/WillId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevealAssetRequest' }
      responses:
        '200':
          description: "Nội dung file gốc (header Content-Disposition: attachment, Cache-Control: no-store)"
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/trustees:
    post:
      tags: [Trustees]
      summary: Chỉ định Trustee, tùy chọn (PS-19, ST-04)
