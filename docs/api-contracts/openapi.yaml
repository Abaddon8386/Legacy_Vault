        Chỉ LEGAL_VERIFIER. reviewerUserId lấy từ principal phía server.
        Ghi nhận yêu cầu bổ sung với reasonCode LEGAL_REQUESTED_SUPPLEMENTATION,
        audit LEGAL_BASIS_REVIEW_REQUIRED cùng transaction, kèm vaultId.
