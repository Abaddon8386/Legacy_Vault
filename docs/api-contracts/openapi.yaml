  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Thông tin người đăng nhập
      x-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Auth]
      summary: Cập nhật hồ sơ của người đăng nhập (PS-79)
      description: >
        PS-79 cập nhật partial fullName, email, phoneNumber và password. Danh tính lấy từ principal.
        currentPassword chỉ là bằng chứng reauthentication, không được lưu; chỉ gửi field này khi email hoặc password
        thực sự thay đổi. Dùng PasswordReauthService và giới hạn REAUTH_FAILED hiện hành.
        Email mới được chuẩn hóa chữ thường và email_verified_at bị xóa vì repository chưa có email verification flow.
        Password phải theo PasswordPolicy, được hash và tăng authVersion trong cùng transaction; JWT cũ bị từ chối
        ở request kế tiếp. Tài khoản password_login_enabled=0 không thể reauthenticate bằng password. Mọi field khác
        ngoài whitelist bị từ chối bằng MALFORMED_REQUEST.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
            example: { fullName: Nguyen Van A, phoneNumber: '+84900000000', email: new@example.test, password: 'NewPassword123', currentPassword: 'CurrentPassword123' }
      responses:
        '200':
          description: Hồ sơ đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400':
          description: VALIDATION_FAILED for profile constraints/password policy; MALFORMED_REQUEST for unsupported fields or missing reauthentication proof
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ReauthenticationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/invitations/redeem:
    post:
      tags: [Auth, Beneficiaries]
      summary: Redeem a beneficiary invitation for the authenticated account (PS-87)
      description: |
        Requires an existing authenticated account. Signup+redeem is intentionally not supported. The backend
        derives the account from the principal and calls the PS-86 transaction seam. A current PS-106 Staff-bound
        generation requires an exact normalized match between the account email and the Staff-confirmed recipient
        email; users.email_verified_at may be NULL for this scoped flow. Staff attestation does not set that field or
        prove mailbox control. Legacy unbound/Owner-issued invitations do not receive this exception and fail closed.
        The existing Beneficiary VERIFIED_AT_COUNTER state is still required; PS-106 attestation does not set it.
        Linking grants no asset-read access; PS-104 exact-recipient DELIVERED authorization remains authoritative.
        Email transport remains disabled, so the outbox does not prove mail delivery or provide an E2E path.
      x-status: implemented
      x-integration-status: blocked
      x-blockers: [approved-mail-transport, ps104-delivered-item-read-api]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryInvitationRedeemRequest' }
      responses:
        '200':
          description: Account linked to the invited Beneficiary; this does not authorize reading undelivered assets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryInvitationLinked' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: BENEFICIARY_INVITATION_EMAIL_VERIFICATION_REQUIRED may apply to unbound/legacy invitation attempts from an account without a verified email; PS-106-bound redemption uses the bound-email match instead. BENEFICIARY_IDENTITY_NOT_VERIFIED is returned when legacy counter verification is absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: BENEFICIARY_INVITATION_INVALID for unknown, expired, revoked, consumed, legacy unbound, or email-mismatched invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: TOO_MANY_ATTEMPTS when five failed attempts occurred for the account or the account+invitation pair in the previous fifteen minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

