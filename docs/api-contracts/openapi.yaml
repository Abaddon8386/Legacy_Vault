      description: |
        Passes the central handover gate (PS-66) first, then lists only the Legal-approved allocation lines of the
        current dossier version whose recipient passed the in-person check (VERIFIED_AT_COUNTER). The Owner configured
        Beneficiary list is never used. Optional recipientId narrows the list; a recipient outside the approved scope or
        not verified returns 409 HANDOVER_RECIPIENT_NOT_ELIGIBLE. deliveryStatus is ELIGIBLE or DELIVERED.
      x-status: implemented
      parameters:
        - name: recipientId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Eligible and already delivered assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EligibleHandoverAssetResponse' }
