      description: |
        Chỉ `LEGAL_VERIFIER`, ca OPEN, Vault LEGAL_BASIS_VERIFICATION và dossier đã forward, không hold.
        Request phải khớp version, SHA-256, allocationHash và snapshot review mới nhất. Từ chối bắt buộc có reason.
        Quyết định append-only, cập nhật trạng thái allocation của đúng version và audit được lưu trong cùng transaction;
        không trả hoặc audit nội dung file.
      x-status: implemented
