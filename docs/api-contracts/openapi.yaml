      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: beneficiaryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Delivery metadata only. ACCEPTED is provider acceptance, not inbox delivery.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationEmailQueued' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Staff, Beneficiaries]
      summary: Reissue or create a PS-86 invitation bound to the counter-confirmed email and queue it (PS-106)
      description: |
        ROLE_STAFF_EXECUTOR and the assigned OPEN case only. The body supplies only expectedGeneration (0 means no
        current invitation); email and recipient are loaded from the latest append-only counter attestation. Requires
        existing VERIFIED_AT_COUNTER, current COURT decision/legal approval, and the Beneficiary to occur in the
        approved current allocation. Existing unbound PS-86 codes are revoked and replaced through PS-86 generation
        rules. The new code and recipient are encrypted into the transactional outbox; code/email are never returned.
        HTTP 202 means stored in the local outbox only. The opt-in Resend worker updates the state asynchronously.
      x-status: implemented
      x-integration-status: requires-mail-configuration
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: beneficiaryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInvitationEmailRequest' }
      responses:
        '202':
          description: Current outbox result. First acceptance is QUEUED; idempotent retries return the existing state.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInvitationEmailQueued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

