    post:
      tags: [Staff]
      summary: Staff chuyển văn bản căn cứ cho Legal (PS-42, ST-19)
      description: |
        Chỉ phiên bản mới nhất (`current = true`) được chuyển; phiên bản cũ trả `409 BASIS_VERSION_STALE` và vẫn được giữ làm
        chứng cứ. Hồ sơ chuyển `LEGAL_BASIS_FORWARDED`, Vault chuyển `LEGAL_BASIS_VERIFICATION`. Chuyển không đồng nghĩa đã duyệt.
      x-status: implemented
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Đã chuyển cho Legal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasisDossierResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/staff/beneficiaries/{beneficiaryId}/identity-verifications:
    post:
      tags: [Staff]
      summary: Ghi nhận xác minh danh tính trực tiếp (PS-45, ST-14)
      description: Requires ROLE_STAFF_EXECUTOR and an OPEN verification case for the Beneficiary Vault assigned to the actor. Missing target or inaccessible case returns 404 RESOURCE_NOT_FOUND; anonymous 401; other roles 403. MATCH sets VERIFIED_AT_COUNTER; NOT_MATCH sets NOT_VERIFIED even from VERIFIED_AT_COUNTER. Both append their unchanged result to history and commit current state and audit atomically. Concurrent decisions are serialized; current state follows the last processed result. Hard-copy CCCD/passport and in-person face comparison only; no eKYC. Optional documentSuffix is exactly four alphanumeric characters. Staff target discovery remains a FE dependency. OPEN is not legal clearance.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/BeneficiaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityVerificationRequest' }
      responses:
        '201':
          description: History appended; current status is VERIFIED_AT_COUNTER for MATCH or NOT_VERIFIED for NOT_MATCH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerificationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Staff]
      summary: Lịch sử xác minh danh tính trực tiếp (PS-45)
      description: Requires ROLE_STAFF_EXECUTOR and an OPEN verification case for the Beneficiary Vault assigned to the actor, even for empty history. Missing target or inaccessible case returns 404 RESOURCE_NOT_FOUND; anonymous 401; other roles 403. Existing MATCH and NOT_MATCH history remains unchanged.
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/BeneficiaryId'
      responses:
        '200':
          description: Lịch sử mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IdentityVerificationResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}:
    put:
      tags: [Beneficiaries]
      summary: Cập nhật Beneficiary
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/BeneficiaryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeneficiaryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/dms:
    put:
      tags: [DMS]
      summary: Bật/cấu hình chu kỳ DMS của Owner đang đăng nhập (PS-22, ST-06)
      description: |
        DMS thuộc tài khoản Owner (mỗi Owner một DMS), lấy từ người đăng nhập, không có tham số Owner/Vault.
        Trả 404 RESOURCE_NOT_FOUND khi Owner chưa có Vault.
        Trả 422 BENEFICIARY_REQUIRED khi Vault đã tồn tại nhưng chưa có Beneficiary. DMS không mở khóa/giải mã.
      x-status: designed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigureDmsRequest' }
            example: { checkIntervalDays: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    get:
      tags: [DMS]
      summary: Xem cấu hình DMS của Owner đang đăng nhập (404 nếu chưa bật)
      x-status: designed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/dms/check-in:
    post:
      tags: [DMS]
      summary: Owner check-in, cập nhật next_check_at (PS-22)
      description: Chỉ hợp lệ khi DMS ở MONITORING (D-API-27). Không mở khóa, không giải mã.
      x-status: designed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DmsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/legal-verifications/verification-cases/{caseId}/basis-dossier/court-decisions:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Legal]
      summary: Legal thẩm định phiên bản quyết định tòa đã chuyển (PS-47)
      description: Chỉ LEGAL_VERIFIER. Ca OPEN, dossier COURT, Vault LEGAL_BASIS_VERIFICATION; chỉ phiên bản mới nhất đã FORWARDED. Không unlock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourtDecisionRequest' }
      responses:
        '201':
          description: Kết luận được lưu cùng audit, lịch sử append-only
          headers:
            Location:
              schema: { type: string }
              description: URL collection court-decisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourtDecisionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Legal]
      summary: Lịch sử thẩm định quyết định tòa, chỉ Legal (PS-47)
      responses:
        '200':
          description: Mới nhất trước, không trả nội dung file
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourtDecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/legal-verifications/verification-cases/{caseId}/basis-dossier/hold:
    post:
      tags: [Legal]
      summary: Legal đưa hồ sơ về ON_HOLD để xét lại bằng phiên bản mới (PS-48)
      description: Chỉ LEGAL_VERIFIER; giữ nguyên lịch sử và phiên bản. Không unlock/handover.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldBasisRequest' }
      responses:
        '200':
          description: Hồ sơ ON_HOLD cùng requiredVersion để nộp lại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasisDossierResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WillId:
      name: willId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrusteeId:
      name: trusteeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Từ 0 (D-API-06)
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Mặc định 20, tối đa 100 (D-API-06)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: VALIDATION_FAILED, có `errors[]` theo trường
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 400
            code: VALIDATION_FAILED
            messageKey: error.validation.failed
            message: Dữ liệu không hợp lệ.
            path: /api/v1/auth/register
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors:
              - { field: email, code: EMAIL, messageKey: validation.Email, message: Email không đúng định dạng. }
    MalformedRequest:
      description: MALFORMED_REQUEST (JSON hỏng, thiếu tham số, sai kiểu như UUID)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: UNAUTHENTICATED — chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 401
            code: UNAUTHENTICATED
            messageKey: error.auth.unauthenticated
            message: Bạn cần đăng nhập để thực hiện thao tác này.
            path: /api/v1/vaults
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors: []
    InvalidCredentials:
      description: INVALID_CREDENTIALS — sai email/mật khẩu hoặc tài khoản đã xóa (không phân biệt)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: ACCESS_DENIED — đã đăng nhập nhưng thiếu role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 403
            code: ACCESS_DENIED
            messageKey: error.auth.accessDenied
            message: Bạn không có quyền thực hiện thao tác này.
            path: /api/v1/vaults
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors: []
    NotFound:
      description: RESOURCE_NOT_FOUND — không tồn tại hoặc không thuộc quyền người gọi (D-API-07)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MethodNotAllowed:
      description: METHOD_NOT_ALLOWED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Xung đột trạng thái/dữ liệu (VAULT_NOT_EDITABLE, TRUSTEE_ALREADY_EXISTS, DMS_NOT_MONITORING, ASSET_QUOTA_EXCEEDED, STORAGE_QUOTA_EXCEEDED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BusinessRuleViolation:
      description: Vi phạm quy tắc nghiệp vụ (ví dụ BENEFICIARY_REQUIRED) — D-API-19
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: TOO_MANY_ATTEMPTS — nhập sai mật khẩu xác nhận quá số lần cho phép (D-API-32)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    SubscriptionUpgradeRequest:
      type: object
      required: [planCode, catalogVersion]
      properties:
        planCode: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        catalogVersion: { type: integer, minimum: 1, example: 2 }
    SubscriptionUpgradeResponse:
      type: object
      required: [subscription, priceDifferenceVnd, changed]
      properties:
        subscription: { $ref: '#/components/schemas/CurrentSubscription' }
        priceDifferenceVnd: { type: integer, format: int64, minimum: 0 }
        changed: { type: boolean }
    SubscriptionLimits:
      type: object
      required: [assetCount, storageBytes, fileBytes]
      properties:
        assetCount: { type: integer, format: int64, minimum: 1 }
        storageBytes: { type: integer, format: int64, minimum: 1, description: Byte nội dung theo đơn vị nhị phân }
        fileBytes: { type: integer, format: int64, minimum: 1 }
    SubscriptionPlan:
      type: object
      required: [code, version, priceVnd, billingModel, limits]
      properties:
        code: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        version: { type: integer, minimum: 1 }
        priceVnd: { type: integer, format: int64, minimum: 0, description: One-time purchase price in VND }
        billingModel: { type: string, enum: [LIFETIME] }
        limits: { $ref: '#/components/schemas/SubscriptionLimits' }
    CurrentSubscription:
      type: object
      required: [effectivePlan, effectiveUntil, usage, overQuota, vaultCreated, evaluatedAt]
      properties:
        effectivePlan: { $ref: '#/components/schemas/SubscriptionPlan' }
        effectiveUntil: { type: string, format: date-time, nullable: true, description: Luôn null vì mọi gói đều trọn đời }
        usage:
          type: object
          required: [assetCount, storageBytes]
          properties:
            assetCount: { type: integer, format: int64, minimum: 0 }
            storageBytes: { type: integer, format: int64, minimum: 0 }
        overQuota:
          type: object
          required: [assets, storage]
          properties:
            assets: { type: boolean }
            storage: { type: boolean }
        vaultCreated: { type: boolean }
        evaluatedAt: { type: string, format: date-time, description: ISO-8601 UTC }
    HoldBasisRequest:
      type: object
      required: [cause, reason]
      properties:
        cause: { type: string, enum: [NEW_DISPUTE, INSUFFICIENT_EVIDENCE] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CourtDecisionRequest:
      type: object
      required: [version, result, reason]
      properties:
        version: { type: integer, minimum: 1 }
        result: { type: string, enum: [VALID, INVALID, INCONCLUSIVE] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CourtDecisionResponse:
      type: object
      required: [id, caseId, version, sha256, result, reason, reviewedBy, reviewedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        result: { type: string, enum: [VALID, INVALID, INCONCLUSIVE] }
        reason: { type: string, maxLength: 1000 }
        reviewedBy: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [timestamp, status, code, messageKey, message, path, traceId, errors]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code:
          type: string
          description: Mã ổn định để FE phân loại. Xem error-contract.md
          enum:
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - EMAIL_ALREADY_EXISTS
            - PAYLOAD_TOO_LARGE
            - ASSET_QUOTA_EXCEEDED
            - STORAGE_QUOTA_EXCEEDED
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
            - BENEFICIARY_REQUIRED
            - VAULT_ALREADY_EXISTS
            - TRUSTEE_ALREADY_EXISTS
            - VAULT_NOT_EDITABLE
            - DMS_NOT_MONITORING
        messageKey: { type: string }
        message:
          type: string
          description: Đã dịch theo Accept-Language; chỉ để hiển thị, KHÔNG dùng để phân loại lỗi
        path: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code, messageKey, message]
      properties:
        field: { type: string }
        code: { type: string, example: NOT_BLANK }
        messageKey: { type: string, example: validation.NotBlank }
        message: { type: string }

    PingResponse:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: UP }
        service: { type: string, example: legacyvault-backend }
        time: { type: string, format: date-time }
    DbCheckResponse:
      type: object
      required: [database]
      properties:
        database: { type: string, enum: [UP, DOWN] }

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
        phone: { type: string, pattern: '^\+?[0-9]{8,15}$' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    UserResponse:
      type: object
      required: [id, fullName, email, roles]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [VAULT_OWNER, STAFF_EXECUTOR, LEGAL_VERIFIER, ADMIN, BENEFICIARY] }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string, description: JWT }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer }
        user: { $ref: '#/components/schemas/UserResponse' }

    CreateVaultRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
    VaultResponse:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VaultPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/VaultResponse' }

    CreateAssetRequest:
      type: object
      required: [name, assetType, payload]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        assetType: { type: string, enum: [TEXT, CREDENTIAL] , description: 'FILE để sau (D-API-13)' }
        description: { type: string, maxLength: 1000 }
        payload: { type: string, writeOnly: true, description: Nội dung bí mật; mã hóa phía server; không bao giờ trả lại }
    UpdateAssetRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        payload: { type: string, writeOnly: true }
    AssetResponse:
      type: object
      required: [id, vaultId, name, assetType, hasPayload, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        name: { type: string }
        assetType: { type: string, enum: [TEXT, CREDENTIAL, FILE] }
        description: { type: string, nullable: true }
        hasPayload: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RevealAssetRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 72, writeOnly: true, description: Mật khẩu đăng nhập hiện tại của Owner; không bao giờ được log }
    AssetSecretResponse:
      type: object
      required: [id, payload]
      properties:
        id: { type: string, format: uuid }
        payload: { type: string, description: Nội dung bảo mật đã giải mã; chỉ trả ở endpoint reveal }
    RecordDeathDocumentRequest:
      type: object
      required: [documentType, issuingAuthority, documentNumber, issuedDate]
      properties:
        documentType: { type: string, enum: [DEATH_CERTIFICATE, DEATH_REGISTRATION_EXTRACT] }
        issuingAuthority: { type: string, minLength: 1, maxLength: 255 }
        documentNumber: { type: string, minLength: 1, maxLength: 100 }
        issuedDate: { type: string, format: date, description: Không ở tương lai }
        evidenceReference: { type: string, maxLength: 500, nullable: true, description: Mã biên nhận/vị trí lưu hồ sơ giấy, không phải file }
        notes: { type: string, maxLength: 1000, nullable: true }
    DeathDocumentRecordResponse:
      type: object
      required: [id, caseId, documentType, issuingAuthority, documentNumber, issuedDate, receivedBy, receivedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        documentType: { type: string, enum: [DEATH_CERTIFICATE, DEATH_REGISTRATION_EXTRACT] }
        issuingAuthority: { type: string }
        documentNumber: { type: string }
        issuedDate: { type: string, format: date }
        receivedBy: { type: string, format: uuid, description: ID công khai của Staff đã nhận }
        receivedAt: { type: string, format: date-time }
        evidenceReference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    RecordOriginalWillRequest:
      type: object
      required: [deliveredByName]
      properties:
        deliveredByName: { type: string, minLength: 1, maxLength: 150 }
        deliveredByRelationship: { type: string, maxLength: 100, nullable: true }
        evidenceReference: { type: string, maxLength: 500, nullable: true, description: Mã biên nhận/vị trí lưu, không phải file }
        conditionNotes: { type: string, maxLength: 1000, nullable: true }
    OriginalWillIntakeResponse:
      type: object
      required: [id, caseId, deliveredByName, receivedBy, receivedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        deliveredByName: { type: string }
        deliveredByRelationship: { type: string, nullable: true }
        receivedBy: { type: string, format: uuid, description: ID công khai của Staff đã nhận }
        receivedAt: { type: string, format: date-time }
        evidenceReference: { type: string, nullable: true }
        conditionNotes: { type: string, nullable: true }
    LegalDeathDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT, REQUEST_MORE] }
        reason: { type: string, minLength: 1, maxLength: 1000, description: Lý do quyết định; không rỗng sau trim }
    LegalDeathDecisionResponse:
      type: object
      required: [deathDocumentPublicId, verificationCasePublicId, result, verifierPublicId, decidedAt, reason, verificationCaseStatus, vaultStatus]
      properties:
        deathDocumentPublicId: { type: string, format: uuid }
        verificationCasePublicId: { type: string, format: uuid }
        result: { type: string, enum: [APPROVED, REJECTED, NEEDS_CORRECTION] }
        verifierPublicId: { type: string, format: uuid, description: Legal Verifier đã quyết định }
        decidedAt: { type: string, format: date-time }
        reason: { type: string }
        verificationCaseStatus: { type: string, description: Vẫn OPEN sau quyết định }
        vaultStatus: { type: string, description: DOCUMENT_VERIFICATION sau APPROVE; giữ nguyên với REJECT/REQUEST_MORE }
    LegalDeathDocumentDetailResponse:
      type: object
      required: [deathDocumentPublicId, verificationCasePublicId, verificationCaseStatus, vaultStatus, document, decisions]
      properties:
        deathDocumentPublicId: { type: string, format: uuid }
        verificationCasePublicId: { type: string, format: uuid }
        verificationCaseStatus: { type: string, enum: [OPEN, CANCELLED] }
        vaultStatus: { type: string }
        document:
          type: object
          required: [documentType, issuingAuthority, documentNumber, issuedDate, receivedByPublicId, receivedAt, createdAt]
          properties:
            documentType: { type: string, enum: [DEATH_CERTIFICATE, DEATH_REGISTRATION_EXTRACT] }
            issuingAuthority: { type: string }
            documentNumber: { type: string }
            issuedDate: { type: string, format: date }
            receivedByPublicId: { type: string, format: uuid, description: Staff đã nhận giấy tờ }
            receivedAt: { type: string, format: date-time }
            evidenceReference: { type: string, nullable: true }
            notes: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
        decisions:
          type: array
          description: Mới nhất trước; rỗng nếu chưa có quyết định
          items:
            type: object
            required: [result, requestedAt]
            properties:
              result: { type: string, enum: [PENDING, APPROVED, REJECTED, NEEDS_CORRECTION] }
              verifierPublicId: { type: string, format: uuid, nullable: true }
              requestedAt: { type: string, format: date-time }
              decidedAt: { type: string, format: date-time, nullable: true }
              reason: { type: string, nullable: true }
    RecordWillComparisonRequest:
      type: object
      required: [originalWillIntakeId, willId, version, result]
      properties:
        originalWillIntakeId: { type: string, format: uuid }
        willId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        result: { type: string, enum: [MATCH, MISMATCH, INCONCLUSIVE] }
        reason: { type: string, maxLength: 1000, nullable: true, description: Bắt buộc khi result khác MATCH }
    WillComparisonResponse:
      type: object
      required: [id, caseId, originalWillIntakeId, willId, version, sha256, result, checkedBy, comparedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        originalWillIntakeId: { type: string, format: uuid }
        willId: { type: string, format: uuid }
        version: { type: integer }
        sha256: { type: string, description: Hash của phiên bản bản scan đã so; không chứng minh giá trị pháp lý }
        result: { type: string, enum: [MATCH, MISMATCH, INCONCLUSIVE] }
        checkedBy: { type: string, format: uuid }
        reason: { type: string, nullable: true }
        comparedAt: { type: string, format: date-time }
    WillComparisonOverviewResponse:
      type: object
      required: [caseId, vaultStatus, approvalBlocked, originalWillIntakes, wills, comparisons]
      properties:
        caseId: { type: string, format: uuid }
        vaultStatus: { type: string }
        approvalBlocked: { type: boolean, description: true trừ khi kết quả đối chiếu mới nhất là MATCH }
        latestResult: { type: string, nullable: true, enum: [MATCH, MISMATCH, INCONCLUSIVE, null] }
        originalWillIntakes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              receivedAt: { type: string, format: date-time }
              evidenceReference: { type: string, nullable: true }
        wills:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              versions:
                type: array
                items:
                  type: object
                  properties:
                    version: { type: integer }
                    contentType: { type: string }
                    sizeBytes: { type: integer, format: int64 }
                    sha256: { type: string }
                    uploadedAt: { type: string, format: date-time }
        comparisons:
          type: array
          description: Mới nhất trước
          items: { $ref: '#/components/schemas/WillComparisonResponse' }
    ClassifyBasisRequest:
      type: object
      required: [route, routeReason]
      properties:
        route: { type: string, enum: [NOTARIAL, COURT, ON_HOLD] }
        routeReason: { type: string, minLength: 1, maxLength: 1000, description: Lý do và chứng cứ phân loại }
    BasisIntakeMetadata:
      type: object
      required: [legalBasisType, issuingAuthority, documentNumber, issueDate]
      properties:
        legalBasisType: { type: string, enum: [NOTARIAL_PARTITION, COURT_JUDGMENT, COURT_DECISION] }
        issuingAuthority: { type: string, maxLength: 255 }
        documentNumber: { type: string, maxLength: 100 }
        issueDate: { type: string, format: date }
        notaryAuthority: { type: string, maxLength: 255, nullable: true }
        notarialDocumentNumber: { type: string, maxLength: 100, nullable: true }
        notarizedAt: { type: string, format: date, nullable: true }
        evidenceReference: { type: string, maxLength: 500, nullable: true }
        notes: { type: string, maxLength: 1000, nullable: true }
        allocations:
          type: array
          description: Kế hoạch phân bổ theo văn bản (bắt buộc, không trùng tài sản - người nhận, thuộc Vault của ca)
          items: { $ref: '#/components/schemas/AllocationInput' }
    BasisVersionResponse:
      type: object
      properties:
        version: { type: integer }
        legalBasisType: { type: string }
        issuingAuthority: { type: string }
        documentNumber: { type: string }
        issueDate: { type: string, format: date }
        notaryAuthority: { type: string, nullable: true }
        notarialDocumentNumber: { type: string, nullable: true }
        notarizedAt: { type: string, format: date, nullable: true }
        evidenceReference: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, description: Hash nội dung gốc; không chứng minh giá trị pháp lý }
        forwardStatus: { type: string, enum: [NOT_FORWARDED, FORWARDED] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        forwardedAt: { type: string, format: date-time, nullable: true }
        current: { type: boolean, description: Phiên bản mới nhất; chỉ phiên bản này được chuyển Legal (PS-42) }
        allocations:
          type: array
          description: Kế hoạch phân bổ theo văn bản (tài sản - người nhận)
          items: { $ref: '#/components/schemas/AllocationResponse' }
    AllocationInput:
      type: object
      required: [assetId, beneficiaryId]
      properties:
        assetId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        description: { type: string, maxLength: 2000, nullable: true }
    AllocationResponse:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        description: { type: string, nullable: true }
    BasisDossierResponse:
      type: object
      properties:
        requiredVersion: { type: integer, minimum: 1, description: Minimum new version required after a hold }
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        route: { type: string, enum: [NOTARIAL, COURT, ON_HOLD] }
        status: { type: string, enum: [DRAFT, LEGAL_BASIS_PROVIDED, LEGAL_BASIS_FORWARDED] }
        disputeStatus: { type: string, enum: [NONE, DISPUTED, UNDETERMINED] }
        routeReason: { type: string, nullable: true, description: Chỉ Legal thấy }
        classifiedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versions:
          type: array
          description: Mới nhất trước
          items: { $ref: '#/components/schemas/BasisVersionResponse' }
    AssetPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AssetResponse' }

    WillVersion:
      type: object
      required: [version, fileName, contentType, sizeBytes, sha256, uploadedAt]
      properties:
        version: { type: integer, minimum: 1 }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Phát hiện thay đổi, không chứng minh giá trị pháp lý' }
        uploadedAt: { type: string, format: date-time }
    WillResponse:
      type: object
      required: [id, vaultId, status, currentVersion, createdAt]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        status: { type: string, enum: [UPLOADED], description: Không bao giờ LEGAL_APPROVED ở API này }
        currentVersion: { $ref: '#/components/schemas/WillVersion' }
        createdAt: { type: string, format: date-time }
    WillPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WillResponse' }

    CreateTrusteeRequest:
      type: object
      required: [vaultId, fullName]
      description: Cần ít nhất một trong `phone`/`email`. Không có `userId`.
      properties:
        vaultId: { type: string, format: uuid }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string }
        email: { type: string, format: email }
        relationship: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 500 }
    UpdateTrusteeRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string }
        email: { type: string, format: email }
        relationship: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 500 }
    TrusteeResponse:
      type: object
      required: [id, vaultId, fullName, status, appointedAt, revokedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        relationship: { type: string, nullable: true }
        note: { type: string, nullable: true }
        status: { type: string, enum: [APPOINTED, REVOKED] }
        appointedAt: { type: string, format: date-time, description: 'UTC appointment time; unchanged by edits' }
        revokedAt: { type: string, format: date-time, nullable: true, description: 'Null while APPOINTED; UTC revocation time when REVOKED' }
        updatedAt: { type: string, format: date-time }
    TrusteePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/TrusteeResponse' }

    TrusteeContactRequest:
      type: object
      required: [channel, outcome, fallbackStatus]
      properties:
        channel: { type: string, enum: [PHONE, EMAIL, IN_PERSON, OTHER] }
        outcome: { type: string, enum: [CONTACTED, NO_RESPONSE, INVALID_CONTACT] }
        fallbackStatus: { type: string, enum: [NOT_REQUIRED, REQUIRED, IN_PROGRESS, COMPLETED] }
        note: { type: string, maxLength: 500, description: Không ghi dữ liệu định danh nhạy cảm }
    TrusteeContactResponse:
      type: object
      required: [id, trusteeId, channel, outcome, fallbackStatus, occurredAt]
      properties:
        id: { type: string, format: uuid }
        trusteeId: { type: string, format: uuid }
        channel: { type: string, enum: [PHONE, EMAIL, IN_PERSON, OTHER] }
        outcome: { type: string, enum: [CONTACTED, NO_RESPONSE, INVALID_CONTACT] }
        fallbackStatus: { type: string, enum: [NOT_REQUIRED, REQUIRED, IN_PROGRESS, COMPLETED] }
        note: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    BeneficiaryRequest:
      type: object
      required: [fullName]
      description: Không có `userId` và không có trường phần chia.
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        relationship: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        phone: { type: string }
        email: { type: string, format: email }
        identityNumber: { type: string, writeOnly: true, description: Chỉ ghi; response không bao giờ trả số này (D-API-26) }
    IdentityVerificationRequest:
      type: object
      required: [documentType, result]
      properties:
        documentType: { type: string, enum: [CCCD, PASSPORT] }
        issuingAuthority: { type: string, maxLength: 150, nullable: true }
        documentSuffix: { type: string, pattern: '^[0-9A-Za-z]{4}$', nullable: true, description: Tối đa 4 ký tự cuối; không gửi số định danh đầy đủ }
        result: { type: string, enum: [MATCH, NOT_MATCH] }
    IdentityVerificationResponse:
      type: object
      required: [id, beneficiaryId, documentType, result, verifiedBy, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        documentType: { type: string, enum: [CCCD, PASSPORT] }
        issuingAuthority: { type: string, nullable: true }
        documentSuffix: { type: string, nullable: true }
        result: { type: string, enum: [MATCH, NOT_MATCH] }
        verifiedBy:
          type: object
          required: [id, fullName]
          properties:
            id: { type: string, format: uuid, description: Public ID của tài khoản Staff đã kiểm tra }
            fullName: { type: string, description: Tên hiện tại của Staff để hiển thị }
        verifiedAt: { type: string, format: date-time }
    BeneficiaryResponse:
      type: object
      required: [id, vaultId, fullName, hasAccount, hasIdentityNumber, status]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        fullName: { type: string }
        relationship: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        hasIdentityNumber: { type: boolean }
        hasAccount: { type: boolean, description: Luôn false ở Sprint 1 }
        status: { type: string, enum: [DESIGNATED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BeneficiaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/BeneficiaryResponse' }
    ConfigurationCheck:
      type: object
      required: [vaultId, ready, beneficiaryCount, issues]
      properties:
        vaultId: { type: string, format: uuid }
        ready: { type: boolean }
        beneficiaryCount: { type: integer, minimum: 0 }
        issues:
          type: array
          items:
            type: object
            required: [code, messageKey, message]
            properties:
              code: { type: string, example: BENEFICIARY_REQUIRED }
              messageKey: { type: string }
              message: { type: string }

    ConfigureDmsRequest:
      type: object
      required: [checkIntervalDays]
      properties:
        checkIntervalDays:
          type: integer
          minimum: 1
          description: Khoảng cho phép do cấu hình (D-API-15); ST-06 nêu ví dụ 30, 90
    DmsResponse:
      type: object
      required: [ownerId, status, checkIntervalDays, gracePeriodDays, nextCheckAt]
      properties:
        ownerId: { type: string, format: uuid, description: 'public_id của tài khoản Owner; DMS thuộc Owner, mỗi Owner một DMS' }
        status: { type: string, enum: [MONITORING, TRIGGERED, GRACE_PERIOD_EXCEEDED] }
        checkIntervalDays: { type: integer }
        gracePeriodDays: { type: integer, description: 'Chỉ đọc; server cấu hình qua DMS_GRACE_PERIOD_DAYS, mặc định 1 (A5)' }
        lastCheckInAt: { type: string, format: date-time, nullable: true }
        nextCheckAt: { type: string, format: date-time }
        triggeredAt: { type: string, format: date-time, nullable: true }
        graceDeadline: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
