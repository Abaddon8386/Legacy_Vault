  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Read-only redacted audit search (PS-108)
      description: ROLE_ADMIN only, no-store. Fixed occurredAt DESC then internal sequence DESC. READ COMMITTED current pages can shift under concurrent inserts. Actor/user/vault IDs are public UUIDs. Raw context, IP, state, names, email and content are never returned.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: from, in: query, description: Inclusive ISO instant with offset; normalized UTC, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive ISO instant; must follow from, schema: { type: string, format: date-time } }
        - { name: action, in: query, description: AuditAction enum name or LEGACY_EVENT; unknown values rejected, schema: { type: string } }
        - { name: actorId, in: query, description: Public user UUID, schema: { type: string, format: uuid } }
        - { name: actorKind, in: query, schema: { type: string, enum: [USER, SYSTEM, DELETED_USER, UNKNOWN] } }
      responses:
        '200':
          description: Whitelisted metadata page; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/audit-logs/{id}:
    get:
      tags: [Admin]
      summary: Read redacted audit event by public UUID (PS-108)
      description: ROLE_ADMIN only, no-store. Missing actor accounts do not hide events. No raw details/IP/states or mutation methods.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Whitelisted metadata and optional trace UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'D-API-04 (2026-10-19): FE keeps the tab session in sessionStorage and revalidates with /auth/me after reload; logout, expiry or HTTP 401 clears the session. No token refresh.'

  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WillId:
      name: willId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrusteeId:
      name: trusteeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BeneficiaryId:
      name: beneficiaryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Từ 0 (D-API-06)
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Mặc định 20, tối đa 100 (D-API-06)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    RecoveryRateLimited:
      description: RATE_LIMITED; only IP/credential limits are exposed
      headers:
        Retry-After: { schema: { type: integer, example: 900 } }
        Cache-Control: { schema: { type: string, enum: [no-store] } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RecoveryUnavailable:
      description: RECOVERY_UNAVAILABLE; configuration or infrastructure unavailable, independent of account eligibility
      headers:
        Cache-Control: { schema: { type: string, enum: [no-store] } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: VALIDATION_FAILED, có `errors[]` theo trường
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 400
            code: VALIDATION_FAILED
            messageKey: error.validation.failed
            message: Dữ liệu không hợp lệ.
            path: /api/v1/auth/register
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors:
              - { field: email, code: EMAIL, messageKey: validation.Email, message: Email không đúng định dạng. }
    MalformedRequest:
      description: MALFORMED_REQUEST (JSON hỏng, thiếu tham số, sai kiểu như UUID)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: UNAUTHENTICATED — chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 401
            code: UNAUTHENTICATED
            messageKey: error.auth.unauthenticated
            message: Bạn cần đăng nhập để thực hiện thao tác này.
            path: /api/v1/vaults
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors: []
    InvalidCredentials:
      description: INVALID_CREDENTIALS — sai email/mật khẩu hoặc tài khoản đã xóa (không phân biệt)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: ACCESS_DENIED — đã đăng nhập nhưng thiếu role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            timestamp: '2026-10-08T10:00:00Z'
            status: 403
            code: ACCESS_DENIED
            messageKey: error.auth.accessDenied
            message: Bạn không có quyền thực hiện thao tác này.
            path: /api/v1/vaults
            traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
            errors: []
    ReauthenticationFailed:
      description: REAUTH_FAILED — mật khẩu hiện tại không hợp lệ cho thao tác nhạy cảm
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: RESOURCE_NOT_FOUND — không tồn tại hoặc không thuộc quyền người gọi (D-API-07)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MethodNotAllowed:
      description: METHOD_NOT_ALLOWED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Xung đột trạng thái/dữ liệu (gồm EMAIL_ALREADY_EXISTS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BusinessRuleViolation:
      description: Vi phạm quy tắc nghiệp vụ (ví dụ BENEFICIARY_REQUIRED) — D-API-19
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: TOO_MANY_ATTEMPTS — nhập sai mật khẩu xác nhận quá số lần cho phép (D-API-32)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    AdminUser:
      type: object
      required: [publicId, fullName, email, roles, createdAt, status]
      properties:
        publicId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time, description: UTC }
        status: { type: string, enum: [PENDING, ACTIVE, DELETED] }
    AdminUserPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    StaffVerificationCasePage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/StaffVerificationCase" } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    StaffVerificationCase:
      type: object
      required: [caseId, caseNumber, status, triggeredAt, closedAt, vaultId, vaultStatus, vaultName, ownerId, ownerName, assignmentStatus, trustee]
      properties:
        caseId: { type: string, format: uuid }
        caseNumber: { type: string }
        status: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
        triggeredAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        vaultId: { type: string, format: uuid }
        vaultStatus: { type: string, description: Current workflow state; not an authorization to unlock or hand over assets }
        vaultName: { type: string }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        assignmentStatus: { type: string, enum: [UNASSIGNED_CLAIMABLE, ASSIGNED_TO_CURRENT_STAFF] }
        trustee:
          type: object
          nullable: true
          description: Present only for GET case detail; null for queue items or when there is no APPOINTED Trustee
          required: [trusteeId, fullName, phone, email, relationship]
          properties:
            trusteeId: { type: string, format: uuid }
            fullName: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, format: email, nullable: true }
            relationship: { type: string, nullable: true }
    BeneficiaryInvitationMetadata:
      type: object
      required: [invitationId, beneficiaryId, state, generation, issuedAt, expiresAt, revokedAt, consumedAt]
      properties:
        invitationId: { type: string, format: uuid, nullable: true }
        beneficiaryId: { type: string, format: uuid }
        state: { type: string, enum: [NOT_ISSUED, PENDING, EXPIRED, REVOKED, CONSUMED] }
        generation: { type: integer, format: int32, minimum: 1, nullable: true }
        issuedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        consumedAt: { type: string, format: date-time, nullable: true }
    BeneficiaryInvitationIssued:
      type: object
      required: [invitation, code]
      properties:
        invitation: { $ref: "#/components/schemas/BeneficiaryInvitationMetadata" }
        code:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^[A-Za-z0-9_-]{21}[AQgw]$'
          description: Server-generated 128-bit base64url code, 7-day lifetime. Only in issue/reissue success; never in logs, GET or URLs.
    BeneficiaryInvitationRedeemRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 128, description: PS-86 code; valid values are canonical 22-character base64url strings. Malformed attempts are counted in the account bucket. Never accept account ID, email, role, or verification flags from the client. }
    BeneficiaryInvitationLinked:
      type: object
      required: [beneficiaryId, accountId, accountStatus]
      properties:
        beneficiaryId: { type: string, format: uuid }
        accountId: { type: string, format: uuid, description: Public ID of the authenticated account }
        accountStatus: { type: string, enum: [ACCOUNT_CREATED] }
    StaffInvitationEmailRequest:
      type: object
      required: [expectedGeneration]
      additionalProperties: false
      properties:
        expectedGeneration: { type: integer, minimum: 0, description: Current generation read by Staff; 0 means no invitation. Used to prevent stale or duplicate rotation. }
    StaffInvitationEmailQueued:
      type: object
      required: [outboxId, invitationId, invitationGeneration, queueStatus, transportStatus]
      properties:
        outboxId: { type: string, format: uuid }
        invitationId: { type: string, format: uuid }
        invitationGeneration: { type: integer, minimum: 1 }
        queueStatus: { type: string, enum: [QUEUED, CLAIMED, SENDING, ACCEPTED, FAILED, UNKNOWN, SKIPPED] }
        transportStatus: { type: string, enum: [ENABLED, DISABLED] }
    SubscriptionPayment:
      type: object
      required: [paymentId, planCode, catalogVersion, amountVnd, currency, billingModel, status, createdAt, expiresAt, checkoutUrl]
      properties:
        paymentId: { type: string, format: uuid }
        planCode: { type: string, enum: [STANDARD, EXTENDED] }
        catalogVersion: { type: integer }
        amountVnd: { type: integer, format: int64 }
        currency: { type: string, enum: [VND] }
        billingModel: { type: string, enum: [LIFETIME] }
        status: { type: string, enum: [PENDING, EXPIRED, SUCCEEDED, FAILED] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Checkout expiry only; paid plan has no expiry }
        checkoutUrl: { type: string, nullable: true, description: Signed sandbox URL only on create/replay before expiry }
    LegalQueueItem:
      type: object
      required: [caseId, caseNumber, vaultId, caseStatus, vaultStatus, route, dossierStatus, reviewStatus, openedAt]
      properties:
        caseId: { type: string, format: uuid }
        caseNumber: { type: string }
        vaultId: { type: string, format: uuid }
        caseStatus: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
        vaultStatus: { type: string }
        route: { type: string, nullable: true }
        dossierStatus: { type: string, nullable: true }
        reviewStatus: { type: string, nullable: true }
        openedAt: { type: string, format: date-time }
    LegalActionCapability:
      type: object
      required: [allowed, blockedReason]
      properties:
        allowed: { type: boolean }
        blockedReason: { type: string, nullable: true, description: Existing shared ErrorCode, or null }
    LegalReadSnapshot:
      type: object
      nullable: true
      required: [dossierId, currentVersion, requiredVersion, sha256Hash, allocationHash, disputeStatus, reviewStatus, reviewFresh, approvalCurrent, latestDecision, courtResult]
      properties:
        dossierId: { type: string, format: uuid }
        currentVersion: { type: integer, minimum: 0 }
        requiredVersion: { type: integer, minimum: 1 }
        sha256Hash: { type: string, nullable: true }
        allocationHash: { type: string }
        disputeStatus: { type: string }
        reviewStatus: { type: string }
        reviewFresh: { type: boolean }
        approvalCurrent: { type: boolean }
        courtResult: { type: string, nullable: true }
        latestDecision:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            versionNo: { type: integer, nullable: true, description: Historical evidence may lack a snapshot }
            sha256Hash: { type: string, nullable: true }
            allocationHash: { type: string, nullable: true }
            disputeStatus: { type: string, nullable: true }
            result: { type: string, enum: [LEGAL_APPROVED, LEGAL_REJECTED] }
            reviewedBy: { type: string, format: uuid, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
    LegalReadContext:
      type: object
      required: [caseId, caseNumber, vaultId, caseStatus, vaultStatus, deathDocuments, willComparison, basisDossier, snapshot, capabilities, evaluatedAt]
      properties:
        caseId: { type: string, format: uuid }
        caseNumber: { type: string }
        vaultId: { type: string, format: uuid }
        caseStatus: { type: string }
        vaultStatus: { type: string }
        deathDocuments:
          type: array
          items:
            type: object
            required: [id, documentType, receivedAt]
            properties:
              id: { type: string, format: uuid }
              documentType: { type: string }
              receivedAt: { type: string, format: date-time }
        willComparison: { $ref: '#/components/schemas/WillComparisonOverviewResponse' }
        basisDossier:
          allOf:
            - $ref: '#/components/schemas/BasisDossierResponse'
          nullable: true
        snapshot: { $ref: '#/components/schemas/LegalReadSnapshot' }
        capabilities:
          type: object
          required: [approval, unlock]
          properties:
            approval: { $ref: '#/components/schemas/LegalActionCapability' }
            unlock: { $ref: '#/components/schemas/LegalActionCapability' }
        evaluatedAt: { type: string, format: date-time }
    HandoverArchiveResponse:
      type: object
      properties:
        vaultId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        vaultStatus: { type: string, enum: [ARCHIVED] }
        caseStatus: { type: string, enum: [CLOSED] }
        archivedAt: { type: string, format: date-time }
    HandoverCloseResponse:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED] }
        closedAt: { type: string, format: date-time }
    HandoverCompletionResponse:
      type: object
      required: [assets, beneficiaries, ready, reason]
      properties:
        assets: { $ref: '#/components/schemas/CompletionProgressResponse' }
        beneficiaries: { $ref: '#/components/schemas/CompletionProgressResponse' }
        ready: { type: boolean }
        reason: { type: string, enum: [READY, ASSETS_PENDING, BENEFICIARIES_PENDING, BOTH_PENDING, EMPTY_SCOPE] }
    CompletionProgressResponse:
      type: object
      required: [completed, total, pending, complete]
      properties:
        completed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        complete: { type: boolean }
    ConfirmBeneficiaryRequest:
      type: object
      required: [receiptReference]
      properties:
        receiptReference: { type: string, minLength: 1, maxLength: 200 }
    BeneficiaryConfirmationResponse:
      type: object
      properties:
        confirmationId: { type: string, format: uuid, nullable: true }
        sessionId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED] }
        confirmedBy: { type: string, format: uuid, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        receiptReference: { type: string, nullable: true }
    LegalApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, versionNo, sha256Hash, allocationHash]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        versionNo: { type: integer, minimum: 1 }
        sha256Hash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        allocationHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        reason: { type: string, maxLength: 1000, description: Bắt buộc khi decision là REJECT }
    LegalApprovalResponse:
      type: object
      required: [dossierId, decision, versionNo, sha256Hash, allocationHash, decidedBy, decidedAt]
      properties:
        dossierId: { type: string, format: uuid }
        decision: { type: string, enum: [LEGAL_APPROVED, LEGAL_REJECTED] }
        versionNo: { type: integer }
        sha256Hash: { type: string, minLength: 64, maxLength: 64 }
        allocationHash: { type: string, minLength: 64, maxLength: 64 }
        decidedBy: { type: string, format: uuid, description: Public ID từ principal xác thực }
        decidedAt: { type: string, format: date-time }
    CompleteLegalBasisReviewRequest:
      type: object
      required: [reason, versionNo, sha256Hash, allocationHash, disputeStatus]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        versionNo: { type: integer, minimum: 1 }
        sha256Hash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        allocationHash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        disputeStatus: { type: string, enum: [NONE, DISPUTED, UNDETERMINED] }
    RecordLegalBasisReviewRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do review hoặc yêu cầu bổ sung; không rỗng sau khi trim.
    LegalBasisReviewResponse:
      type: object
      required: [dossierId, reviewStatus, reviewRequired, reasonCode, reason, currentVersionNo, currentSha256Hash, currentDisputeStatus, currentAllocationHash, checkedAt]
      description: 'D-API-08: chỉ trả public UUID, không trả khóa chính tuần tự trong database.'
      properties:
        dossierId: { type: string, format: uuid, description: Public ID của dossier }
        reviewStatus: { type: string, nullable: true }
        reviewRequired: { type: boolean }
        reasonCode: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        currentVersionNo: { type: integer, nullable: true }
        currentSha256Hash: { type: string, nullable: true }
        currentDisputeStatus: { type: string, nullable: true }
        currentAllocationHash: { type: string, nullable: true }
        checkedAt: { type: string, format: date-time, nullable: true }
    HoldBasisRequest:
      type: object
      required: [cause, reason]
      properties:
        cause: { type: string, enum: [NEW_DISPUTE, INSUFFICIENT_EVIDENCE] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CourtDecisionRequest:
      type: object
      required: [version, result, reason]
      properties:
        version: { type: integer, minimum: 1 }
        result: { type: string, enum: [VALID, INVALID, INCONCLUSIVE] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CourtDecisionResponse:
      type: object
      required: [id, caseId, version, sha256, result, reason, reviewedBy, reviewedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        result: { type: string, enum: [VALID, INVALID, INCONCLUSIVE] }
        reason: { type: string, maxLength: 1000 }
        reviewedBy: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time }
    HandoverSessionStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [CANCELLED] }
    HandoverSessionResponse:
      type: object
      required: [sessionId, caseId, vaultId, staffId, status, openedAt, closedAt]
      properties:
        sessionId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, COMPLETED, CANCELLED] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    CreateHandoverReceiptRequest:
      type: object
      required: [recipientId, assetIds]
      additionalProperties: false
      properties:
        recipientId: { type: string, format: uuid }
        assetIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        supersedesReceiptId: { type: string, format: uuid, nullable: true }
    EligibleHandoverAssetResponse:
      type: object
      required: [assetId, recipientId, deliveryStatus]
      properties:
        assetId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        description: { type: string, nullable: true, description: Mô tả dòng phân bổ theo văn bản căn cứ }
        deliveryStatus: { type: string, enum: [ELIGIBLE, DELIVERED] }
    HandoverDeliveryRequest:
      type: object
      required: [recipientId, assetIds]
      properties:
        recipientId: { type: string, format: uuid }
        assetIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    HandoverItemResponse:
      type: object
      required: [itemId, sessionId, assetId, recipientId, status, deliveredAt, staffId]
      properties:
        itemId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        status: { type: string, enum: [DELIVERED, VERIFIED_BY_BENEFICIARY] }
        deliveredAt: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
    HandoverReceiptResponse:
      type: object
      required: [receiptId, sessionId, recipientId, assetIds, staffId, dossierVersionNo, sha256Hash, allocationHash, confirmationType, confirmedAt]
      properties:
        receiptId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        assetIds:
          type: array
          items: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        dossierVersionNo: { type: integer, minimum: 1 }
        sha256Hash: { type: string, minLength: 64, maxLength: 64 }
        allocationHash: { type: string, minLength: 64, maxLength: 64 }
        confirmationType: { type: string, enum: [STAFF_ATTESTATION] }
        confirmedAt: { type: string, format: date-time }
        supersedesReceiptId: { type: string, format: uuid, nullable: true }
    ApiError:
      type: object
      required: [timestamp, status, code, messageKey, message, path, traceId, errors]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code:
          type: string
          description: Mã ổn định để FE phân loại. Xem error-contract.md
          enum:
            - RECOVERY_INVALID
            - RECOVERY_UNAVAILABLE
            - RATE_LIMITED
            - PASSWORD_POLICY
            - REAUTH_FAILED
            - TRUSTEE_REVOKED
            - ALERT_NOT_CANCELLABLE
            - VERIFICATION_CASE_NOT_CLAIMABLE
            - WILL_NOT_VERIFIED
            - BASIS_DOSSIER_ALREADY_EXISTS
            - BASIS_VERSION_STALE
            - LEGAL_DECISION_STALE
            - LEGAL_APPROVAL_REQUIRED
            - COURT_EVIDENCE_REQUIRED
            - COURT_DECISION_REQUIRED
            - LEGAL_WORKFLOW_ON_HOLD
            - LEGAL_VERIFICATION_INVALID_STATE
            - LEGAL_VERIFICATION_ALREADY_DECIDED
            - SUBSCRIPTION_POLICY_PENDING
            - PAYMENT_REQUEST_CONFLICT
            - SUBSCRIPTION_UPGRADE_UNAVAILABLE
            - SUBSCRIPTION_CATALOG_STALE
            - SUBSCRIPTION_DOWNGRADE_NOT_ALLOWED
            - PLAN_VERSION_NOT_FOUND
            - PLAN_VERSION_NOT_EDITABLE
            - PLAN_VERSION_ALREADY_EXISTS
            - PLAN_VERSION_CONFLICT
            - ASSET_IMAGE_LIMIT_EXCEEDED
            - ASSET_DOCUMENT_LIMIT_EXCEEDED
            - PAYMENT_TRANSACTION_SOURCE_UNAVAILABLE
            - CASE_EVIDENCE_QUOTA_EXCEEDED
            - ASSET_QUOTA_EXCEEDED
            - STORAGE_QUOTA_EXCEEDED
            - TOO_MANY_ATTEMPTS
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - INVALID_GOOGLE_CREDENTIAL
            - GOOGLE_SIGNIN_UNAVAILABLE
            - GOOGLE_IDENTITY_ALREADY_LINKED
            - ACCESS_DENIED
            - RESOURCE_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - EMAIL_ALREADY_EXISTS
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
            - BENEFICIARY_REQUIRED
            - VAULT_ALREADY_EXISTS
            - TRUSTEE_ALREADY_EXISTS
            - VAULT_NOT_EDITABLE
            - DMS_NOT_MONITORING
            - VERIFICATION_CASE_NOT_OPEN
            - INTAKE_ATTACHMENT_LIMIT_EXCEEDED
            - HANDOVER_SESSION_ALREADY_OPEN
            - HANDOVER_SESSION_INVALID_STATE
            - HANDOVER_RECEIPT_INVALID_STATE
            - HANDOVER_RECEIPT_ASSET_NOT_ALLOCATED
            - HANDOVER_RECEIPT_RECIPIENT_NOT_VERIFIED
            - HANDOVER_VAULT_NOT_UNLOCKED
            - HANDOVER_RECIPIENT_NOT_ELIGIBLE
            - HANDOVER_ASSET_NOT_ELIGIBLE
            - HANDOVER_ASSET_ALREADY_DELIVERED
            - HANDOVER_COMPLETION_PENDING
            - HANDOVER_CONFIRMATION_PENDING_DELIVERY
            - HANDOVER_CONFIRMATION_CONFLICT
            - BENEFICIARY_IDENTITY_NOT_VERIFIED
            - BENEFICIARY_ACCOUNT_ALREADY_LINKED
            - BENEFICIARY_ACCOUNT_INELIGIBLE
            - BENEFICIARY_INVITATION_ALREADY_EXISTS
            - BENEFICIARY_INVITATION_ALREADY_USED
            - BENEFICIARY_INVITATION_STALE
            - BENEFICIARY_GUARDIAN_STALE
            - BENEFICIARY_INVITATION_INVALID
            - BENEFICIARY_INVITATION_EMAIL_VERIFICATION_REQUIRED
            - BENEFICIARY_INVITATION_COUNTER_EMAIL_REQUIRED
            - HANDOVER_RECEIPT_REISSUE_INVALID
            - BASIS_DOSSIER_INVALID_STATE
        messageKey: { type: string }
        message:
          type: string
          description: Đã dịch theo Accept-Language; chỉ để hiển thị, KHÔNG dùng để phân loại lỗi
        path: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code, messageKey, message]
      properties:
        field: { type: string }
        code: { type: string, example: NOT_BLANK }
        messageKey: { type: string, example: validation.NotBlank }
        message: { type: string }

    PingResponse:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: UP }
        service: { type: string, example: legacyvault-backend }
        time: { type: string, format: date-time }
    DbCheckResponse:
      type: object
      required: [database]
      properties:
        database: { type: string, enum: [UP, DOWN] }

    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254, writeOnly: true }
        locale: { type: string, enum: [vi, en], default: vi }
    PasswordRecoveryReset:
      type: object
      required: [credential, password]
      properties:
        credential: { type: string, maxLength: 128, writeOnly: true, description: Canonical base64url 256-bit reset secret; never an access JWT }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true, description: Shared password policy also limits UTF-8 to 72 bytes; no trimming }

    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72, writeOnly: true }
        phone: { type: string, pattern: '^\+?[0-9]{8,15}$' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    GoogleLoginRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential: { type: string, minLength: 1, maxLength: 8192, writeOnly: true, description: GIS ID token; backend verifies the signature and claims. }
    GoogleIdentityLinkResponse:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean, enum: [true] }
    UserResponse:
      type: object
      required: [id, fullName, email, roles]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [VAULT_OWNER, STAFF_EXECUTOR, LEGAL_VERIFIER, ADMIN, BENEFICIARY] }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phoneNumber: { type: string, pattern: '^$|^\\+?[0-9]{8,15}$', nullable: true }
        email: { type: string, format: email, maxLength: 254, nullable: true }
        password: { type: string, minLength: 8, maxLength: 72, nullable: true, description: New password; must meet PasswordPolicy and is never returned. }
        currentPassword: { type: string, writeOnly: true, description: Required only when email or password changes; used only for PasswordReauthService. }
    ProfileResponse:
      type: object
      required: [id, fullName, email, roles]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string, enum: [VAULT_OWNER, STAFF_EXECUTOR, LEGAL_VERIFIER, ADMIN, BENEFICIARY] }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string, description: JWT }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer }
        user: { $ref: '#/components/schemas/UserResponse' }

    CreateVaultRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
    VaultResponse:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VaultPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/VaultResponse' }

    CreateAssetRequest:
      type: object
      required: [name, assetType, payload]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        assetType: { type: string, enum: [TEXT, CREDENTIAL] , description: 'FILE để sau (D-API-13)' }
        description: { type: string, maxLength: 1000 }
        payload: { type: string, writeOnly: true, description: Nội dung bí mật; mã hóa phía server; không bao giờ trả lại }
    UpdateAssetRequest:
      type: object
      required: [password]
      description: Cần ít nhất một trong name, description, payload cùng với password (PS-111, D-API-40)
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        payload: { type: string, writeOnly: true }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true, description: Mật khẩu đăng nhập hiện tại của Owner; không bao giờ được log hoặc trả lại }
    AssetResponse:
      type: object
      required: [id, vaultId, name, assetType, hasPayload, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
