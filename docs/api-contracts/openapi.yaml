openapi: 3.0.3
info:
  title: LegacyVault API
  version: 0.1.0-draft
  description: |
    Contract Sprint 1 (PS-9 → PS-23). Quyết định đã chốt ngày 2026-10-11 (xem open-decisions.md), chờ FE/BE review.
    `x-status: designed` = đã chốt contract, chưa triển khai. `x-status: implemented` = đã có code Backend trong workspace.
    `x-status: blocked` = contract draft, chưa có runtime endpoint. `x-integration-status: blocked` = endpoint đã tồn tại nhưng flow chưa đủ điều kiện tích hợp end-to-end.
    Mọi lỗi dùng cùng hình dạng `ApiError` (kể cả 401/403). FE phân loại lỗi bằng `code`, không bằng `message`.
    Ví dụ dùng dữ liệu giả; không chứa token hay mật khẩu thật.
servers:
  - url: http://localhost:8080
    description: Backend local
  - url: http://localhost:5173
    description: Qua Vite proxy (khuyến nghị khi dev)
tags:
  - name: System
  - name: Auth
  - name: Vaults
  - name: Assets
  - name: Wills
  - name: Trustees
  - name: Staff
  - name: Legal
  - name: Beneficiaries
  - name: DMS
  - name: Subscriptions
  - name: Admin

security:
  - bearerAuth: []

paths:
  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}/guardian:
    $ref: "./guardian.openapi.yaml#/paths/~1api~1v1~1vaults~1{vaultId}~1beneficiaries~1{beneficiaryId}~1guardian"
  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}/guardian/revoke:
    $ref: "./guardian.openapi.yaml#/paths/~1api~1v1~1vaults~1{vaultId}~1beneficiaries~1{beneficiaryId}~1guardian~1revoke"
  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}/guardian/history:
    $ref: "./guardian.openapi.yaml#/paths/~1api~1v1~1vaults~1{vaultId}~1beneficiaries~1{beneficiaryId}~1guardian~1history"
  /api/v1/admin/subscriptions/transactions/{paymentId}:
    $ref: "./admin-payments.openapi.yaml#/paths/~1api~1v1~1admin~1subscriptions~1transactions~1{paymentId}"
  /api/v1/staff/verification-cases:
    get:
      tags: [Staff]
      summary: Read cases assigned to the current Staff and OPEN unassigned claimable cases
      x-status: implemented
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, CANCELLED, CLOSED] } }
        - { name: q, in: query, required: false, description: "PS-88 (D-API-46). Case-insensitive search by Vault name, owner name or Beneficiary name (contains), case reference HS-YYYY-NNNNNN, or case/Vault public UUID (exact). Trimmed, max 100 chars, no control characters. Only narrows the Staff queue.", schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Queue; trustee is null in list items and returned only by case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffVerificationCasePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/verification-cases/{caseId}:
    get:
      tags: [Staff]
      summary: Read case context available to the current Staff
      description: An OPEN unassigned case is claimable and viewable; a case assigned to another Staff is hidden as 404. Trustee summary contains only current APPOINTED contact fields, never notes or identity-document data.
      x-status: implemented
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Case, Vault state, assignment state, owner summary and optional current Trustee contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffVerificationCase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/staff/verification-cases/{caseId}/claim:
    post:
      tags: [Staff]
      summary: Claim an OPEN unassigned case for the current Staff
      description: Conditional assignment and audit are atomic. The success response includes the same case detail context; caller identity comes from the authenticated principal.
      x-status: implemented
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Claimed case and current Trustee contact summary, if present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffVerificationCase" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: VERIFICATION_CASE_NOT_CLAIMABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}/invitation:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/BeneficiaryId"
    get:
      tags: [Beneficiaries]
      summary: Owner reads current invitation metadata, never the code or hash
      description: Owner of this Vault only. NOT_ISSUED when no generation exists. Cache-Control no-store.
      x-status: implemented
      responses:
        "200":
          description: Current metadata, including for frozen or archived Vaults owned by caller
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiaryInvitationMetadata" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Beneficiaries]
      summary: Owner issues the first invitation for an unlinked Beneficiary in an ACTIVE Vault
      description: No body required. Code possession proves acceptance, not legal identity. 128-bit CSPRNG, 7 days UTC. Plaintext returned once. Existing generation is a conflict; never auto-rotate on retry.
      x-status: implemented
      responses:
        "201":
          description: Invitation issued atomically with audit; no Location containing the code
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiaryInvitationIssued" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BENEFICIARY_INVITATION_ALREADY_EXISTS, BENEFICIARY_ACCOUNT_ALREADY_LINKED or VAULT_NOT_EDITABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      tags: [Beneficiaries]
      summary: Owner revokes the current unused invitation in an ACTIVE Vault
      description: Repeated revocation of the same generation returns 204 without replacing evidence or audit. Stale generation is 409 and cannot revoke a newer code. No invitation is 404; consumed invitation is 409. Account linkage is never removed.
      x-status: implemented
      parameters:
        - name: generation
          in: query
          required: true
          description: Current generation displayed to Owner; prevents a delayed or repeated request from revoking a reissued code
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        "204": { description: Revoked or already revoked; Cache-Control no-store }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BENEFICIARY_INVITATION_STALE, BENEFICIARY_INVITATION_ALREADY_USED or VAULT_NOT_EDITABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/vaults/{vaultId}/beneficiaries/{beneficiaryId}/invitation/reissue:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/BeneficiaryId"
    post:
      tags: [Beneficiaries]
      summary: Owner explicitly replaces an unused invitation with a new generation
      description: ACTIVE owned Vault only. Atomically revokes and retires the old generation. Client generation prevents concurrent or repeated rotation. Read metadata and explicitly reissue after losing a success response; code cannot be recovered.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation]
              properties:
                generation: { type: integer, format: int32, minimum: 1 }
      responses:
        "201":
          description: New code returned once; Cache-Control no-store
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BeneficiaryInvitationIssued" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BENEFICIARY_INVITATION_STALE, BENEFICIARY_INVITATION_ALREADY_USED, BENEFICIARY_ACCOUNT_ALREADY_LINKED or VAULT_NOT_EDITABLE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/subscriptions/me/payments:
    post:
      tags: [Subscriptions]
      summary: Create or replay a VNPay sandbox one-time checkout (Owner)
      description: Server snapshots catalog price and limits. UUID key is unique per owner. No entitlement until verified IPN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, catalogVersion, idempotencyKey]
              properties:
                planCode: { type: string, enum: [STANDARD, EXTENDED] }
                catalogVersion: { type: integer, minimum: 1 }
                idempotencyKey: { type: string, format: uuid }
      responses:
        '200':
          description: Created or replayed checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPayment' }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Catalog stale, non-upgrade, gateway unavailable or PAYMENT_REQUEST_CONFLICT }
  /api/v1/subscriptions/me/payments/{id}:
    get:
      tags: [Subscriptions]
      summary: Read own server-confirmed payment status (Owner)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status only; checkoutUrl is null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPayment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown payment or different owner }
  /api/v1/payments/vnpay/ipn:
    get:
      tags: [Subscriptions]
      security: []
      summary: Public VNPay IPN, HMAC-SHA512 authentication
      description: Signed vnp_* query parameters per VNPay PAY 2.1.0. Duplicated keys rejected. See payments-vnpay.md. Only this endpoint records payment results.
      responses:
        '200':
          description: VNPay acknowledgment; 99 means processing failed and transaction rolled back
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string, enum: ['00', '01', '02', '04', '97', '99'] }
                  Message: { type: string }
  /api/v1/legal-verifications/verification-cases:
    get:
      tags: [Legal]
      summary: Paginated Legal discovery using the existing global Legal case scope (PS-102)
      description: LEGAL_VERIFIER only. Metadata, no assignment changes or asset content. See legal-read-context.md.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
        - in: query
          name: route
          schema: { type: string, enum: [NOTARIAL, COURT, ON_HOLD] }
      responses:
        '200':
          description: Stable openedAt DESC / internal tie-break, no-store; not a cross-request snapshot
          content:
            application/json:
              schema:
                type: object
                required: [content, page, size, totalElements, totalPages]
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/LegalQueueItem' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  totalPages: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/legal-verifications/verification-cases/{caseId}/context:
    get:
      tags: [Legal]
      summary: Locked metadata/snapshot/capability read for Legal (PS-102)
      description: No writes, unlock, file download or decryption. Capabilities are advisory; mutations always recheck current guards.
      parameters:
        - in: path
          name: caseId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: No-store. Missing dossier is null, never inferred as approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalReadContext' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Case or associated Vault not found }
  /api/v1/vaults/{vaultId}/assets/with-images:
    parameters:
      - $ref: "#/components/parameters/VaultId"
    post:
      tags: [Assets]
      summary: "Owner asset photos; see lifetime-plans-and-asset-images.md"
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [asset, images]
              properties:
                asset: { $ref: "#/components/schemas/CreateAssetRequest" }
                images:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
            encoding:
              asset: { contentType: application/json }
      responses:
        "201":
          description: "Success; JPEG/PNG 5 MiB per image, max 5 per asset. Download requires reauthentication."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetResponse" }
        "400": { description: "Shared ApiError; see image contract" }
        "401": { description: "Shared ApiError; see image contract" }
        "403": { description: "Shared ApiError; see image contract" }
        "404": { description: "Shared ApiError; see image contract" }
        "409": { description: "Shared ApiError; see image contract" }
        "413": { description: "Shared ApiError; see image contract" }
        "415": { description: "Shared ApiError; see image contract" }
        "429": { description: "Shared ApiError; see image contract" }
  /api/v1/vaults/{vaultId}/assets/{assetId}/images:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Assets]
      summary: "Owner asset photos; see lifetime-plans-and-asset-images.md"
      x-status: implemented
      responses:
        "200":
          description: "Success; JPEG/PNG 5 MiB per image, max 5 per asset. Download requires reauthentication."
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [id, fileName, contentType, sizeBytes, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    fileName: { type: string }
                    contentType: { type: string, enum: [image/jpeg, image/png] }
                    sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 5242880 }
                    createdAt: { type: string, format: date-time }
        "400": { description: "Shared ApiError; see image contract" }
        "401": { description: "Shared ApiError; see image contract" }
        "403": { description: "Shared ApiError; see image contract" }
        "404": { description: "Shared ApiError; see image contract" }
        "409": { description: "Shared ApiError; see image contract" }
        "413": { description: "Shared ApiError; see image contract" }
        "415": { description: "Shared ApiError; see image contract" }
        "429": { description: "Shared ApiError; see image contract" }
    post:
      tags: [Assets]
      summary: "Owner asset photos; see lifetime-plans-and-asset-images.md"
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "201":
          description: "Success; JPEG/PNG 5 MiB per image, max 5 per asset. Download requires reauthentication."
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [id, fileName, contentType, sizeBytes, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    fileName: { type: string }
                    contentType: { type: string, enum: [image/jpeg, image/png] }
                    sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 5242880 }
                    createdAt: { type: string, format: date-time }
        "400": { description: "Shared ApiError; see image contract" }
        "401": { description: "Shared ApiError; see image contract" }
        "403": { description: "Shared ApiError; see image contract" }
        "404": { description: "Shared ApiError; see image contract" }
        "409": { description: "Shared ApiError; see image contract" }
        "413": { description: "Shared ApiError; see image contract" }
        "415": { description: "Shared ApiError; see image contract" }
        "429": { description: "Shared ApiError; see image contract" }
  /api/v1/vaults/{vaultId}/assets/{assetId}/images/{imageId}/download:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Assets]
      summary: "Owner asset photos; see lifetime-plans-and-asset-images.md"
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealAssetRequest" }
      responses:
        "200":
          description: "Success; JPEG/PNG 5 MiB per image, max 5 per asset. Download requires reauthentication."
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: "Shared ApiError; see image contract" }
        "401": { description: "Shared ApiError; see image contract" }
        "403": { description: "Shared ApiError; see image contract" }
        "404": { description: "Shared ApiError; see image contract" }
        "409": { description: "Shared ApiError; see image contract" }
        "413": { description: "Shared ApiError; see image contract" }
        "415": { description: "Shared ApiError; see image contract" }
        "429": { description: "Shared ApiError; see image contract" }
  /api/v1/vaults/{vaultId}/assets/{assetId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Assets]
      summary: "Owner asset photos; see lifetime-plans-and-asset-images.md"
      x-status: implemented
      responses:
        "204":
          description: "Success; JPEG/PNG 5 MiB per image, max 5 per asset. Download requires reauthentication."
        "400": { description: "Shared ApiError; see image contract" }
        "401": { description: "Shared ApiError; see image contract" }
        "403": { description: "Shared ApiError; see image contract" }
        "404": { description: "Shared ApiError; see image contract" }
        "409": { description: "Shared ApiError; see image contract" }
        "413": { description: "Shared ApiError; see image contract" }
        "415": { description: "Shared ApiError; see image contract" }
        "429": { description: "Shared ApiError; see image contract" }
  /api/v1/vaults/{vaultId}/assets/{assetId}/documents:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Assets]
      summary: Owner lists PDF/Word documents attached to an Asset (PS-114)
      description: Metadata only; no content. Owner of the Vault only. See asset-documents.md.
      x-status: implemented
      responses:
        "200":
          description: Oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AssetDocument" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Assets]
      summary: Owner attaches PDF/DOC/DOCX files to an Asset (PS-114)
      description: |
        multipart/form-data with one or more `documents` parts. Types are detected by content; macro-enabled files and other
        containers are rejected. All files of a request are stored or none. Bytes count toward the plan storage quota; the
        document does not occupy an Asset slot. Vault must be ACTIVE. A Will is never a target.
      x-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documents]
              properties:
                documents: { type: array, items: { type: string, format: binary } }
      responses:
        "201":
          description: Metadata of every document of the Asset
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AssetDocument" } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "ASSET_DOCUMENT_LIMIT_EXCEEDED, STORAGE_QUOTA_EXCEEDED or VAULT_NOT_EDITABLE" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/vaults/{vaultId}/assets/{assetId}/documents/{documentId}/download:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Assets]
      summary: Owner reads one attached document after re-entering the login password (PS-114)
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealAssetRequest" }
      responses:
        "200":
          description: Decrypted bytes. Always attachment, nosniff, no-store, CSP sandbox.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/msword: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "ACCESS_DENIED (role) or REAUTH_FAILED (wrong password; not 401)" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: VAULT_NOT_EDITABLE }
        "429": { description: TOO_MANY_ATTEMPTS }
  /api/v1/vaults/{vaultId}/assets/{assetId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/AssetId"
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Assets]
      summary: Owner removes an attached document and frees its storage (PS-114)
      x-status: implemented
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: VAULT_NOT_EDITABLE }
  /api/v1/received-assets:
    get:
      tags: [Beneficiary]
      summary: Beneficiary account lists the assets Staff delivered to it (PS-104)
      description: |
        Role BENEFICIARY only. The account is taken from the principal; only handover items DELIVERED or
        VERIFIED_BY_BENEFICIARY to a Beneficiary linked to this account are returned, from every source Vault, newest first.
        Undelivered allocations are never listed. Still readable after the Vault is archived. See received-assets.md.
      x-status: implemented
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Page of received items (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [content, page, size, totalElements, totalPages]
                properties:
                  content: { type: array, items: { $ref: "#/components/schemas/ReceivedAsset" } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  totalPages: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/received-assets/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Beneficiary]
      summary: Beneficiary account reads one received item, metadata only (PS-104)
      x-status: implemented
      responses:
        "200":
          description: The item; never content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivedAsset" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/received-assets/{itemId}/images:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Beneficiary]
      summary: Metadata of the images of a received asset (PS-104)
      x-status: implemented
      responses:
        "200":
          description: Image metadata, no bytes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, fileName, contentType, sizeBytes, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    fileName: { type: string }
                    contentType: { type: string, enum: [image/jpeg, image/png] }
                    sizeBytes: { type: integer, format: int64 }
                    createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/received-assets/{itemId}/content:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Beneficiary]
      summary: Beneficiary account reads the decrypted content of a received asset after re-entering the password (PS-104)
      description: Shares the attempt limit with reveal. Wrong password 403 REAUTH_FAILED (not 401); over the limit 429. Never cached.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealAssetRequest" }
      responses:
        "200":
          description: Decrypted content (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [itemId, assetId, payload]
                properties:
                  itemId: { type: string, format: uuid }
                  assetId: { type: string, format: uuid }
                  payload: { type: string, writeOnly: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: TOO_MANY_ATTEMPTS }
  /api/v1/received-assets/{itemId}/images/{imageId}/download:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Beneficiary]
      summary: Beneficiary account reads one image of a received asset after re-entering the password (PS-104)
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealAssetRequest" }
      responses:
        "200":
          description: Decrypted bytes. Always attachment, nosniff, no-store, CSP sandbox.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: TOO_MANY_ATTEMPTS }
  /api/v1/subscriptions/me/upgrade-quote:
    post:
      tags: [Subscriptions]
      summary: Full target lifetime price, no previous purchase credit; does not activate a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, catalogVersion]
              properties:
                planCode: { type: string, enum: [STANDARD, EXTENDED] }
                catalogVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Informational server quote; checkout uses a separate POST
          content:
            application/json:
              schema:
                type: object
                required: [planCode, catalogVersion, amountVnd, currency, billingModel, previousPurchaseCreditVnd, paymentAvailable]
                properties:
                  planCode: { type: string }
                  catalogVersion: { type: integer }
                  amountVnd: { type: integer, format: int64 }
                  currency: { type: string, enum: [VND] }
                  billingModel: { type: string, enum: [LIFETIME] }
                  previousPurchaseCreditVnd: { type: integer, enum: [0] }
                  paymentAvailable: { type: boolean, description: VNPay sandbox is configured and enabled }
        '401': { description: Unauthenticated }
        '403': { description: Owner role required }
        '409': { description: Stale catalog or non-upgrade }
  /api/v1/subscription-plans:
    get:
      tags: [Subscriptions]
      summary: Available lifetime subscription catalog
      description: ROLE_VAULT_OWNER. Free BASIC and available paid tiers. Independent of the quota enforcement flag.
      x-status: implemented
      responses:
        '200':
          description: Ba gói theo giới hạn tài sản tăng dần. Byte nhị phân; giá VND một lần, trọn đời.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubscriptionPlan' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SUBSCRIPTION_POLICY_PENDING — prototype chưa được nhóm duyệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Tra cứu tài khoản (PS-109, chỉ đọc)
      description: Yêu cầu ROLE_ADMIN. Chỉ trả publicId, fullName, email, roles, createdAt và trạng thái hiệu lực; không trả khóa DB hoặc credential.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 }, description: Tìm chuỗi con theo tên/email }
        - { name: role, in: query, schema: { type: string, maxLength: 50 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, ACTIVE, DELETED] } }
      responses:
        '200':
          description: Trang tài khoản theo envelope phân trang chung.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{publicId}:
    get:
      tags: [Admin]
      summary: Tra cứu chi tiết tài khoản theo public ID (PS-109, chỉ đọc)
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tài khoản; chỉ trả các trường allow-list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/overview:
    get:
      tags: [Admin]
      summary: Admin overview from real SQL counts (PS-107)
      description: ROLE_ADMIN only. Nondeleted accounts including locked; non-ARCHIVED vaults; OPEN cases; per-role assignments on nondeleted accounts. READ_COMMITTED_COLLECTION_WINDOW is explicitly not an atomic cross-table snapshot. No content or private account fields.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Real counts and UTC collection interval; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/subscriptions/plans:
    get:
      tags: [Admin, Subscriptions]
      summary: Danh sách tóm tắt các gói sử dụng (PS-82)
      description: Yêu cầu quyền ROLE_ADMIN. Trả về thông tin tóm tắt 3 gói BASIC, STANDARD, EXTENDED.
      responses:
        '200':
          description: Danh sách gói và trạng thái phiên bản active/draft.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/subscriptions/plans/{planCode}:
    get:
      tags: [Admin, Subscriptions]
      summary: Chi tiết gói và toàn bộ lịch sử phiên bản (PS-82)
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
      responses:
        '200':
          description: Chi tiết cấu hình và mảng các phiên bản.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/subscriptions/plans/{planCode}/versions:
    post:
      tags: [Admin, Subscriptions]
      summary: Tạo bản nháp mới cho gói (PS-82)
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceVersionId]
              properties:
                sourceVersionId: { type: integer, format: int64 }
                changeNotes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Bản nháp mới được tạo thành công.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Đã tồn tại bản nháp chưa công bố hoặc xung đột phiên bản.

  /api/v1/admin/subscriptions/plans/{planCode}/versions/{version}:
    put:
      tags: [Admin, Subscriptions]
      summary: Cập nhật bản nháp phiên bản (PS-82)
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameVi, nameEn, purchasePriceVnd, billingModel, assetLimit, storageBytesLimit, fileBytesLimit, concurrencyToken]
              properties:
                nameVi: { type: string, minLength: 1, maxLength: 100 }
                nameEn: { type: string, minLength: 1, maxLength: 100 }
                descriptionVi: { type: string, maxLength: 500 }
                descriptionEn: { type: string, maxLength: 500 }
                purchasePriceVnd: { type: integer, format: int64, minimum: 0 }
                billingModel: { type: string, enum: [LIFETIME] }
                assetLimit: { type: integer, format: int64, minimum: 1 }
                storageBytesLimit: { type: integer, format: int64, minimum: 10485760 }
                fileBytesLimit: { type: integer, format: int64, minimum: 10485760, maximum: 10485760 }
                concurrencyToken: { type: integer, format: int64 }
                changeNotes: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Bản nháp được cập nhật thành công.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Phiên bản không ở trạng thái DRAFT hoặc concurrency token không khớp.

  /api/v1/admin/subscriptions/plans/{planCode}/versions/{version}/publish:
    post:
      tags: [Admin, Subscriptions]
      summary: Công bố phiên bản cấu hình chính thức (PS-82)
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Phiên bản chuyển sang PUBLISHED, bản cũ chuyển DEPRECATED.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Chỉ bản nháp DRAFT mới được phép công bố.

  /api/v1/admin/subscriptions/plans/{planCode}/versions/{version}/deprecate:
    post:
      tags: [Admin, Subscriptions]
      summary: Ngừng áp dụng phiên bản (PS-82)
      parameters:
        - name: planCode
          in: path
          required: true
          schema: { type: string, enum: [BASIC, STANDARD, EXTENDED] }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Phiên bản chuyển sang DEPRECATED.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Không thể ngừng phiên bản đang là DRAFT hoặc đã DEPRECATED.

  /api/v1/admin/subscriptions/accounts:
    get:
      tags: [Admin, Subscriptions]
      summary: Tra cứu mức dùng thật và gói hiệu lực của tài khoản (PS-82)
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thông tin gói hiệu lực, entitlement status và usage thật.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/subscriptions/transactions:
    $ref: "./admin-payments.openapi.yaml#/paths/~1api~1v1~1admin~1subscriptions~1transactions"
  /api/v1/subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: Gói hiệu lực và usage của Owner hiện tại (PS-77)
      description: |
        Quyền ROLE_VAULT_OWNER; Owner lấy từ principal. Chưa có Vault trả usage 0.
        BASIC miễn phí hoặc tier cao nhất đã thanh toán qua IPN; quota enforcement vẫn cấu hình độc lập.
        Count gồm mọi Asset còn lưu kể cả DOCUMENT; byte gồm payload UTF-8 và mọi file version còn lưu.
        Không áp quota subscription vào evidence pháp lý.
      x-status: implemented
      responses:
        '200':
          description: Snapshot gói/usage dưới cùng khóa Owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSubscription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SUBSCRIPTION_POLICY_PENDING — prototype chưa được nhóm duyệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/subscriptions/me/upgrade:
    post:
      tags: [Subscriptions]
      summary: Legacy self-grant endpoint disabled; use payments checkout
      description: |
        ROLE_VAULT_OWNER. Request không phải bằng chứng thanh toán hoặc xác nhận cấp gói.
        Luôn 409 SUBSCRIPTION_UPGRADE_UNAVAILABLE cho request hợp lệ, không cấp entitlement.
        PS-80 dùng /subscriptions/me/payments và IPN; cờ quota không mở self-grant.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpgradeRequest' }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SUBSCRIPTION_UPGRADE_UNAVAILABLE — chưa có quy trình cấp gói/thanh toán được duyệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/system/ping:
    get:
      tags: [System]
      summary: Smoke test ứng dụng (PS-74)
      x-status: implemented
      security: []
      responses:
        '200':
          description: Ứng dụng đang chạy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PingResponse' }
              example: { status: UP, service: legacyvault-backend, time: '2026-10-08T10:00:00Z' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/system/db-check:
    get:
      tags: [System]
      summary: Kiểm tra kết nối SQL Server bằng truy vấn chỉ đọc (chỉ profile dev)
      description: Profile khác `dev` -> 404. Chỉ trả UP/DOWN, không bao giờ trả lỗi SQL.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DbCheckResponse' }
              example: { database: UP }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/password-recovery/requests:
    post:
      tags: [Auth]
      summary: Yêu cầu khôi phục mật khẩu (PS-112)
      x-status: implemented
      security: []
      description: Neutral durable acceptance; no proof of email delivery or account existence. Email delivery disabled by default. See password-recovery.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
      responses:
        '202':
          description: Accepted or neutrally suppressed by per-email limits
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [messageKey]
                properties:
                  messageKey: { type: string, enum: [auth.recovery.requestAccepted] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RecoveryRateLimited' }
        '503': { $ref: '#/components/responses/RecoveryUnavailable' }

  /api/v1/auth/password-recovery/reset:
    post:
      tags: [Auth]
      summary: Đổi mật khẩu bằng credential một lần (PS-112)
      x-status: implemented
      security: []
      description: Atomically consumes purpose-bound credential, changes BCrypt password, revokes links and all LegacyVault JWTs. Never unlocks accounts, changes roles or creates provider links. No automatic login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryReset' }
      responses:
        '204':
          description: Password reset committed; sign in again
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
        '400':
          description: RECOVERY_INVALID or password/input validation; no expired/used/account-status oracle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RecoveryRateLimited' }
        '503': { $ref: '#/components/responses/RecoveryUnavailable' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (PS-9, ST-01)
      x-status: designed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { fullName: Nguyen Van A, email: user@example.com, password: ExamplePass123, phone: '0900000000' }
      responses:
        '201':
          description: Tạo thành công
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                timestamp: '2026-10-08T10:00:00Z'
                status: 409
                code: EMAIL_ALREADY_EXISTS
                messageKey: error.auth.emailExists
                message: Email này đã được đăng ký.
                path: /api/v1/auth/register
                traceId: 7f3c1e2a-5b4d-4c1e-9a77-0d9f2b1c3a10
                errors: []

  /api/v1/auth/login:
