        AWAITING_LEGAL_BASIS or LEGAL_BASIS_VERIFICATION. ON_HOLD, ACTIVE, UNLOCKED, HANDOVER_IN_PROGRESS
        and ARCHIVED are not readable. Lists ACTIVE assets in the case Vault, excluding DOCUMENT (will files).
        Only public assetId, assetType and display name are returned; no description, secret, payload, image,
