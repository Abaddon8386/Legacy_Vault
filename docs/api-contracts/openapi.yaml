      tags: [Staff]
      summary: Ghi nhận bàn giao tài sản tại quầy (PS-65, ST-25)
      description: |
        Passes the central handover gate (PS-66): Staff owns an OPEN case, the Vault is UNLOCKED or
        HANDOVER_IN_PROGRESS, no hold, the Legal approval still matches the current version/hash/scope, and the
        session is OPEN. Every requested asset must be an approved line for the recipient and not yet delivered;
        the whole request is all or nothing. The first delivery moves the Vault UNLOCKED -> HANDOVER_IN_PROGRESS.
        Audit HANDOVER_ASSET_DELIVERED (ST-25, LV-HANDOVER-001). No asset content is returned.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverDeliveryRequest' }
      responses:
        '201':
