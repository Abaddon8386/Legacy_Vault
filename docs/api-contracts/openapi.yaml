        beneficiaries.linked_user_id and account_status = ACCOUNT_CREATED, grants ROLE_BENEFICIARY if absent, audits
        BENEFICIARY_ACCOUNT_LINKED (ST-24). The Beneficiary record stays independent of the account. Rejected with
        409 BENEFICIARY_ACCOUNT_INELIGIBLE when the account is inactive/deleted, is the Vault Owner, holds
