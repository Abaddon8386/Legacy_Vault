spring:
  application:
    name: legacyvault-backend
  datasource:
    url: ${DB_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.security: TRACE
  pattern:
    level: "%5p [%X{traceId:-}]"

# Không để Spring tự đưa stack trace / message / chi tiết binding vào response lỗi.
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

legacyvault:
  cors:
    # Danh sách origin được phép, phân cách bằng dấu phẩy. Mặc định rỗng (dev dùng Vite proxy nên không cần).
    # Ví dụ khi muốn gọi thẳng không qua proxy: CORS_ALLOWED_ORIGINS=http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET_BASE64}
    expiration-seconds: 3600
  encryption:
    # Khóa AES-256 mã hóa payload tài sản và file di chúc (PS-15, PS-17): base64 của đúng 32 byte.
    # Không có giá trị mặc định, không commit khóa thật; thiếu khóa thì ứng dụng không khởi động (giống JWT_SECRET_BASE64).
    key: ${LEGACYVAULT_ENCRYPTION_KEY}
    # Ghi vào cột encryption_key_version để giải mã đúng khóa khi xoay khóa.
    key-version: ${LEGACYVAULT_ENCRYPTION_KEY_VERSION:v1}
  asset:
    # Giới hạn payload Asset tính theo byte UTF-8 (D-API-29, mặc định 64 KB).
    max-payload-bytes: 65536
