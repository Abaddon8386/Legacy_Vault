spring:
  application:
    name: legacyvault-backend
  datasource:
    url: ${DB_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        format_sql: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

legacyvault:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  beneficiary:
    identity-encryption-key: ${BENEFICIARY_ENCRYPTION_KEY:}
  dms:
    check-interval-min-days: ${LEGACYVAULT_DMS_MIN_INTERVAL_DAYS:1}
    check-interval-max-days: ${LEGACYVAULT_DMS_MAX_INTERVAL_DAYS:32767}
    scheduler:
      fixed-delay-ms: ${LEGACYVAULT_DMS_SCAN_DELAY_MS:60000}